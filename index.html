<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c2457a">
<title>Ma Déco Pro – Gestion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf6f4;--card:#fff;--ink:#2b2430;--muted:#7a7180;--line:#ece3e7;--accent:#c2457a;--accent-soft:#fbe9f1;--gold:#c99634;--green:#2e8b57;--red:#c0392b;--orange:#d9822b;--blue:#3b6fb6;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:90px}
header.top{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{flex:1 0 auto;min-width:72px;border:0;background:none;padding:8px 6px 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:0;border-radius:0}
nav#nav button span{font-size:20px;line-height:1}
nav#nav button.on{color:var(--accent);font-weight:700}
@media(min-width:900px){
 body{padding-bottom:20px;padding-left:200px}
 nav#nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:60px}
 nav#nav button{flex:0 0 auto;flex-direction:row;font-size:15px;gap:10px;padding:12px 18px;justify-content:flex-start}
 header.top{margin-left:-200px;padding-left:216px}
}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:21px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px}
.kpi.hl{background:var(--accent-soft);border-color:#f3c9db}
.muted{color:var(--muted)}
small{font-size:12.5px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
button:hover{border-color:#d8c4cd}
.pri{background:var(--accent);border-color:var(--accent);color:#fff!important;font-weight:600}
.danger{color:var(--red);border-color:#f1c9c4}
.sm{padding:5px 10px;min-height:32px;font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:0;min-height:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
label.f{margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:9px 10px;border:1px solid #ddd2d7;border-radius:9px;background:#fff;margin-top:3px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #f0bcd3;border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.list .it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-grey{background:#efedf0;color:#5d5862}.b-green{background:#e3f4ea;color:#21704a}.b-red{background:#fbe5e2;color:#a8311f}.b-orange{background:#fdf0e1;color:#a65f12}.b-blue{background:#e5eef9;color:#2c5794}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#f2ecef;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border-radius:20px;padding:6px 13px;min-height:34px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gauge{height:16px;background:#f0eaee;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.gauge div{height:100%;border-radius:10px}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.a-red{background:#fbe5e2;color:#8e2617}.a-orange{background:#fdf0e1;color:#8a4e0f}.a-blue{background:#e5eef9;color:#244a80}.a-green{background:#e3f4ea;color:#1c5e3e}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 4px}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t input{margin:0;padding:6px 8px}
.scroll{overflow-x:auto}
.chart{width:100%;height:auto}
.chart .gl{stroke:#eee6ea}.chart .ax{font-size:11px;fill:#8a8590}.chart .b1{fill:var(--accent)}.chart .b2{fill:var(--gold)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* vignettes */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px #f3c9db}
.tile.click{cursor:pointer}
.tile[draggable=true]{cursor:grab}
.tile .img{aspect-ratio:4/3;background:#f4eef1;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile .bd{padding:8px 9px;flex:1;display:flex;flex-direction:column;gap:2px}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .st{font-size:12px;color:var(--muted);line-height:1.35}
.tile .warn{color:var(--red);font-size:12px;font-weight:600}
.tile .warn:empty{display:none}
.tile .tag{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.92);border-radius:12px;font-size:11px;padding:1px 8px;font-weight:600}
.stepper{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:6px}
.stepper button{min-height:34px;width:34px;flex:0 0 34px;justify-content:center;padding:0;font-size:18px}
.stepper input{margin:0;text-align:center;padding:6px 2px;min-width:0}
.tile select{margin-top:6px;padding:5px 6px;font-size:12.5px}
.dropzone{min-height:80px;border:2px dashed transparent;border-radius:12px;padding:4px;transition:background .15s,border-color .15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .hint{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:2px dashed var(--line);border-radius:10px}
.subcat{margin-bottom:12px}.subcat>.row{margin:6px 0}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.typeopt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink);margin:0;font-size:14px}
.typeopt.on{border-color:var(--accent);background:var(--accent-soft)}
.typeopt small{display:block;color:var(--muted);font-size:12px}
.typeopt input{margin-top:2px}
.bl{display:inline-block;border-bottom:1px dotted #888;height:1.15em;vertical-align:bottom}
.blk-seller{width:56%;font-size:12px}.fl{display:flex;gap:6px;align-items:flex-end;margin:6px 0}.fl .lab{white-space:nowrap;color:#555}.fl .bl.fx{flex:1;width:auto}
.endrow{display:flex;gap:16px;align-items:stretch;margin-top:4px}.endrow .sigl{flex:1;border:1px dashed #bbb;border-radius:6px;padding:8px;font-size:12px;color:#666}.endrow .inv-tot{width:52%;margin:0}
.cbox{border:1px solid #e5dde1;border-radius:8px;padding:6px 12px 4px;margin-bottom:10px}.cbox .lbl{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.5px}
.inv.blank .inv-to div{margin:7px 0}.inv.blank .inv-ev{margin:12px 0}
.inv table.lgrid td{height:8.2mm;border:1px solid #ddd}.inv table.lgrid th{border:1px solid #ddd}
.inv-tot.bt td{padding:7px 8px}
.rbox{border:1px solid #e5dde1;border-radius:8px;padding:6px 14px;margin:8px 0 16px}
.rrow{display:flex;gap:12px;align-items:flex-end;padding:9px 0;border-bottom:1px solid #f1eaee}.rrow:last-child{border-bottom:0}
.rrow>span:first-child{width:130px;flex:0 0 130px;color:#777}.rrow .bl{flex:1}.rrow.big b{font-size:20px}
.rcpt .inv-title{font-size:21px}
.sign2{display:flex;gap:16px;margin-top:22px}.sign2 div{flex:1;border:1px dashed #bbb;border-radius:6px;height:80px;padding:8px;font-size:12px;color:#666}
.navrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.navrow:last-child{border-bottom:0}.navrow .grow{flex:1}.navnum{width:22px;color:var(--muted);font-size:13px}.navrow button{min-width:36px;justify-content:center}.navrow button:disabled{opacity:.3}
.dl{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl input{margin-top:3px}
.dl .grow{flex:1;min-width:0}
.dl .dlt{font-weight:600}
.dl .dlr{text-align:right;white-space:nowrap;font-size:13.5px}
.dl.late{background:#fff4f2}
.dl.done{opacity:.55}
.dlm{font-weight:700;color:var(--muted);text-transform:capitalize;margin:12px 0 2px;font-size:13px}
.chk input{margin-top:2px}
.catsec{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;background:#fff}
.catsec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;border-radius:var(--radius);user-select:none}
.catsec>summary::-webkit-details-marker{display:none}
.catsec .chev{display:inline-block;transition:transform .15s;font-size:14px;color:var(--muted);width:14px}
.catsec[open] .chev{transform:rotate(90deg)}
.catsec .secbody{padding:0 14px 6px}
.catsec.sec-consommable{background:#fdeef4;border-color:#f3cfdf}
.catsec.sec-materiel{background:#eaf6ee;border-color:#c8e6d2}
.catsec.sec-service{background:#f3f1f5}
.catsec.sec-a_classer{background:#fff7ec;border-color:#f0c48a}
.dropsum.over{outline:2px dashed var(--accent);outline-offset:-4px}
.catsec .dropzone .hint{background:rgba(255,255,255,.55)}
.catcard.todo{border-color:#f0c48a;background:#fffaf2}
.totalbar{position:sticky;bottom:70px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 4px 18px rgba(60,20,40,.08);z-index:10}
@media(min-width:900px){.totalbar{bottom:12px}}
@media(max-width:600px){.totalbar{padding:8px 10px}.totalbar .tot{font-size:18px}.totalbar button{padding:6px 10px;min-height:36px;font-size:13.5px}}
.totalbar .tot{font-size:20px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(30,15,25,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:720px;padding:18px;margin:auto 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.photos .ph{position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;cursor:pointer}
.photos .ph button{position:absolute;top:4px;right:4px;min-height:0;padding:2px 7px;font-size:12px}
.preview-img{max-width:100%;max-height:70vh;display:block;margin:0 auto 10px;border-radius:8px}
.method{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.method:last-child{border-bottom:0}
.eline{display:grid;grid-template-columns:1fr 64px 84px 84px 34px;gap:6px;align-items:center;margin-bottom:6px}
.eline input,.eline select{margin:0;padding:7px 7px}
.eline .lk{grid-column:1/5}
.eline .pp{grid-column:1/-1}
.eline{padding:6px;border-radius:9px;border:1px solid var(--line)}
.eline.priv{background:#f3f1f5;opacity:.8}
.eline.priv .nm{text-decoration:line-through}
@media(max-width:560px){.eline{grid-template-columns:1fr 1fr 1fr 34px}.eline .nm{grid-column:1/5}.eline .lk{grid-column:1/5}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.05);padding:28px;overflow-x:auto}
/* ===== Document imprimable ===== */
.inv{position:relative;font-size:13px;color:#222;min-width:560px}
.inv .wm{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:84px;font-weight:800;color:rgba(194,69,122,.10);transform:rotate(-18deg);pointer-events:none}
.inv-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
.inv-from{display:flex;gap:14px;align-items:flex-start}
.inv-logo{max-width:110px;max-height:90px;object-fit:contain}
.inv-name{font-size:16px}
.inv-title{font-size:24px;font-weight:800;color:var(--accent);letter-spacing:.5px;margin-bottom:6px;text-align:right}
.inv-meta table td{padding:1px 0 1px 12px;text-align:right}
.inv-meta table td:first-child{color:#777}
.inv-to{margin-left:auto;width:48%;border:1px solid #e5dde1;border-radius:8px;padding:10px 12px;margin-bottom:16px}
.inv-to .lbl{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.5px;margin-bottom:3px}
.inv-ev{margin-bottom:12px}
.inv table.lines{width:100%;border-collapse:collapse;margin-bottom:12px}
.inv table.lines th{background:#f6eef2;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:7px 8px}
.inv table.lines td{padding:7px 8px;border-bottom:1px solid #eee;vertical-align:top}
.inv table.lines .r{text-align:right;white-space:nowrap}
.inv table.lines small{color:#777;display:block}
.inv-tot{margin-left:auto;width:52%;border-collapse:collapse}
.inv-tot td{padding:4px 8px}
.inv-tot td:last-child{text-align:right;white-space:nowrap}
.inv-tot tr.big td{font-size:16px;font-weight:800;border-top:2px solid #222;padding-top:7px}
.inv-mention{margin-top:16px;font-weight:700;border:1px solid #e5dde1;background:#fbf7f9;padding:8px 10px;border-radius:6px}
.inv-pay,.inv-notes,.inv-cond{margin-top:12px;white-space:pre-line}
.inv-sign{margin-top:22px;display:flex;justify-content:flex-end}
.inv-sign div{width:45%;border:1px dashed #bbb;border-radius:6px;height:90px;padding:8px;font-size:12px;color:#666}
.inv-foot{margin-top:26px;border-top:1px solid #eee;padding-top:8px;font-size:11px;color:#888;text-align:center}
.pk-photo{max-width:100%;max-height:320px;border-radius:8px;display:block;margin:10px 0}
/* synchronisation */
.syncb{border:0;background:rgba(255,255,255,.18);color:#fff!important;border-radius:16px;padding:4px 11px;min-height:0;font-size:12.5px;line-height:1.2;display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto;white-space:nowrap;margin-left:10px}
.syncb small{font-size:10.5px;opacity:.9;font-weight:400}
.syncb.warn{background:#fff3cd;color:#7a4b00!important}
.syncb.off{background:rgba(0,0,0,.22)}
.syncb[hidden]{display:none}
body.locked nav#nav{display:none}
body.locked{padding-left:0!important}
@media(min-width:900px){body.locked header.top{margin-left:0;padding-left:16px}}
#printArea{display:none}
@page{size:A4;margin:12mm}
@media print{
 body{background:#fff;padding:0!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 .inv{min-width:0;font-size:11.5pt}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.ctag{display:inline-block;vertical-align:middle;font-size:11px;font-weight:700;line-height:1;padding:3px 7px;border-radius:99px;white-space:nowrap}.ctag.big{font-size:13px;padding:5px 10px}.ct-pro{background:#e3ecf9;color:#24508f}.ct-part{background:#f2ece6;color:#7a5a3a}
.exm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 4px 6px;margin-top:4px;border-bottom:2px solid var(--accent-soft);color:var(--ink);font-size:14px}.exm:first-child{padding-top:2px;margin-top:0}.exm span{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top"><div class="brand" id="brandName">Ma Déco Pro</div><button id="syncBadge" class="syncb" data-act="syncInfo" hidden></button></header>
<nav id="nav"></nav>
<main id="app"><div class="empty">Chargement…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box"><div id="modalBody"></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
'use strict';
/* ================= Outils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const EUR=new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(+n||0);
const r2=n=>Math.round((+n||0)*100)/100;
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?0:x};
const nf=n=>String(+(+n||0).toFixed(2)).replace('.',',');
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fd=iso=>iso?iso.split('-').reverse().join('/'):'';
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const MONTHS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const sum=(a,f)=>r2(a.reduce((s,x)=>s+(f?f(x):x),0));
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}

/* ================= Stockage local (IndexedDB) ================= */
const STORES=['settings','clients','catalog','expenses','docs'];
// stores internes : file d'attente des envois, état de la synchro, photos déjà en ligne
const SYS={outbox:'k',meta:'k',files:'h'};
let _lastTs=0;const nowTs=()=>(_lastTs=Math.max(Date.now(),_lastTs+1));
const DB={db:null,mem:null,
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('decoGestion',2);
   r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});

const Auth={KEY:'mdp.session',

 async grant(type,body){let r;try{r=await netFetch(`${SB.url}/auth/v1/token?grant_type=${type}`,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw offErr()}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.msg||j.message||j.error||('Erreur '+r.status)),{status:r.status});
  const s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at?j.expires_at*1000:Date.now()+(j.expires_in||3600)*1000,user:{email:(j.user&&j.user.email)||body.email||this.email()}};this.set(s);return s},

  try{return (await this.grant('refresh_token',{refresh_token:s.refresh_token})).access_token}
  catch(e){if(e.offline)throw e;if(e.status>=400&&e.status<500){this.set(null);throw authErr('Session expirée : reconnectez-vous')}throw e}}
};
async function api(path,{method='POST',body,headers={},raw=false}={}){
 if(navigator.onLine===false)throw offErr();
 for(let attempt=0;attempt<2;attempt++){const tok=await Auth.token(attempt>0),isBlob=body instanceof Blob;let r;
  try{r=await netFetch(SB.url+path,{method,headers:{apikey:SB.key,Authorization:'Bearer '+tok,...(body!==undefined&&!isBlob?{'Content-Type':'application/json'}:{}),...headers},body:body===undefined?undefined:isBlob?body:JSON.stringify(body)})}catch(e){throw offErr()}
  if(r.status===401&&attempt===0)continue;
  if(!r.ok){const t=await r.text().catch(()=>'');if(r.status===401)throw authErr('Session expirée : reconnectez-vous');
   if(r.status===403||/42501|Accès refusé/.test(t))throw authErr('Ce compte n\'est pas autorisé à utiliser cette appli');
   throw Object.assign(new Error('Erreur du serveur ('+r.status+') '+t.slice(0,160)),{status:r.status})}
  return raw?r:r.json()}
}
async function mapStrings(v,fn){if(typeof v==='string')return fn(v);if(Array.isArray(v)){const o=[];for(const x of v)o.push(await mapStrings(x,fn));return o}
 if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v))o[k]=await mapStrings(v[k],fn);return o}return v}
const IMG_EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','application/pdf':'pdf'};
async function fileName(dataUrl){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(dataUrl)));

const REF='@fichier:';

const Sync={on:!!SB,ready:false,state:'idle',pending:0,last:+(localStorage.getItem('mdp.last')||0),err:'',running:null,again:false,timer:null,importing:false,needRender:false,changed:false,
 async meta(k){const m=await DB.get('meta',k);return m?m.v:undefined},

 async mark(store,id,ts,o={}){if(!this.on||!this.ready||!STORES.includes(store))return;const k=store+'|'+id,old=await DB.get('outbox',k);
  await DB.raw('outbox',{k,store,id,ts,del:!!o.del,imp:!o.del&&(this.importing||!!(old&&old.imp)),purge:!!o.purge});await this.count();this.soon()},
 async count(){this.pending=(await DB.all('outbox')).length;this.badge()},

 run(){if(!this.on)return Promise.resolve();if(!Auth.s){this.state='auth';this.badge();return Promise.resolve()}
  if(this.running){this.again=true;return this.running}
  this.running=(async()=>{this.state='sync';this.badge();
   try{await this.push();await this.pull();await this.hydrate();this.state='ok';this.err='';this.last=Date.now();try{localStorage.setItem('mdp.last',this.last)}catch(e){}}
   catch(e){console.warn('Synchro :',e);this.state=e.offline?'offline':e.auth?'auth':'error';this.err=e.message}
   this.running=null;
   if(this.state==='ok')try{await readPendingTickets()}catch(e){console.warn('Lecture des tickets :',e)}
   await this.count();

 // photos et PDF : envoyés une seule fois dans l'espace de stockage, remplacés par une référence
 async externalize(rec){return mapStrings(rec,async v=>{if(!v.startsWith('data:')||v.length<200)return v;const n=await fileName(v),f=await DB.get('files',n);
  if(!f||!f.up){const b=dataURLtoBlob(v);await api('/storage/v1/object/photos/'+n,{body:b,headers:{'Content-Type':b.type||'application/octet-stream','x-upsert':'true'},raw:true});await DB.raw('files',{h:n,d:v,up:1})}
  return REF+n})},
 async internalize(data){let missing=false;const out=await mapStrings(data,async v=>{if(!v.startsWith(REF))return v;const n=v.slice(REF.length),f=await DB.get('files',n);if(f&&f.d)return f.d;
  try{const r=await api('/storage/v1/object/authenticated/photos/'+n,{method:'GET',raw:true});const d=await blobToDataURL(await r.blob());await DB.raw('files',{h:n,d,up:1});return d}catch(e){missing=true;return v}});
  return{data:out,missing}},
 async push(){for(let guard=0;guard<400;guard++){const batch=(await DB.all('outbox')).sort((a,b)=>a.ts-b.ts).slice(0,25);if(!batch.length)return;const items=[];
  for(const e of batch){if(e.del){items.push({store:e.store,id:e.id,deleted:true,data:{},client_ts:e.ts,purge:e.purge});continue}
   const rec=await DB.get(e.store,e.id);if(!rec){await DB.rawDel('outbox',e.k);continue}
   const data=await this.externalize(rec);delete data._ts;items.push({store:e.store,id:e.id,data,deleted:false,client_ts:rec._ts||e.ts,import:e.imp})}
  if(!items.length)continue;
  const res=await api('/rest/v1/rpc/push_records',{body:{items}});
  for(const r of res||[]){const k=r.store+'|'+r.id,sent=batch.find(e=>e.k===k),cur=await DB.get('outbox',k);
   if(!sent||!cur||cur.ts!==sent.ts)continue;// modifié à nouveau entre-temps : renvoyé au prochain tour
   await DB.rawDel('outbox',k);
   if(r.status==='conflict')toast('⚠️ Un document importé porte un numéro déjà utilisé en ligne : il n\'a pas été envoyé.');
   else if(r.row&&r.status!=='ok')await this.apply({store:r.store,id:r.id,...r.row})}

   const L=(await this.meta('hydrate'))||[],k=r.store+'|'+r.id;if(missing&&!L.includes(k))await this.setMeta('hydrate',[...L,k]);else if(!missing&&L.includes(k))await this.setMeta('hydrate',L.filter(x=>x!==k))}

function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function compressImage(file,max=1600,q=0.72,type='image/jpeg'){
 const url=typeof file==='string'?file:await readFile(file);
 return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(img,0,0,w,h);res(c.toDataURL(type,q))};
  img.onerror=()=>res(url);img.src=url});
}

function matInfo(it,SM){const s=stk(it,SM),N=N_AMORT(),share=r2(num(it.cost)/N),am=r2(Math.min(s.uses,N)*share);return{uses:s.uses,N,share,amorti:am,reste:r2(num(it.cost)-am),ok:s.uses>=N}}
function unitCost(it,SM){if(!it)return 0;if(it.kind==='pack'){const p=packCost(it.comp,SM);return r2(p.art+p.mat)}const t=catOf(it).type;if(t==='materiel'){const m=matInfo(it,SM);return m.ok?0:m.share}return num(it.cost)}
function packCost(comp,SM){SM=SM||stockMap();let art=0,mat=0;const det=[];(comp||[]).forEach(c=>{const it=item(c.itemId);if(!it)return;const t=catOf(it).type;
 let u,am=false;if(t==='materiel'){const mi=matInfo(it,SM);am=mi.ok;u=am?0:mi.share}else u=num(it.cost);const v=r2(u*num(c.qty));det.push({it,qty:num(c.qty),u,v,t,am});if(t==='materiel')mat+=v;else art+=v});
 return{art:r2(art),mat:r2(mat),det}}
function packPossible(p,SM){let n=Infinity;(p.comp||[]).forEach(c=>{const it=item(c.itemId);if(!it||catOf(it).type!=='stock'||!num(c.qty))return;n=Math.min(n,Math.floor(stk(it,SM).dispo/num(c.qty)))});return n===Infinity?null:Math.max(0,n)}

 const mo=r2(num(k.heures)*num(s.taux)),dep=r2(num(k.km)*num(s.prixKm)),frais=num(k.frais??s.fraisFixe),marge=num(k.marge??s.marge);
 const base=r2(pc.art+pc.mat+mo+dep+frais);return{...pc,mo,dep,frais,marge,base,m1:r2(base*(1+marge/100)),m2:r2(pc.art*num(s.coef)),m3:r2(mo+pc.art+pc.mat+dep),marche:num(k.marche)}}

/* ================= CRÉATEUR DE PACK ================= */
function packCalcHTML(){const s=S.settings,c=calcPack(PK),p=num(PK.price);
 const meth=(t,d,v)=>`<div class="method"><div><b>${t}</b><br><small class="muted">${d}</small></div><div class="row" style="flex-wrap:nowrap"><b>${eur(v)}</b><button type="button" class="sm" data-act="usePackPrice" data-v="${v}">Utiliser</button></div></div>`;
 const al=[];
 if(p>0&&p<c.base)al.push(['red',`Votre prix (${eur(p)}) est sous le coût de revient (${eur(c.base)}) : vous perdez de l'argent.`]);
 else if(p>0&&p<c.m1)al.push(['orange',`Le prix couvre les coûts mais le bénéfice est sous votre objectif (marge : ${eur(p-c.base)}).`]);
 if(p>0&&c.marche>0&&p>c.marche*1.2)al.push(['orange',`Prix ${Math.round((p/c.marche-1)*100)} % au-dessus du marché : rentable mais peut-être difficile à vendre.`]);
 if(p>0&&c.marche>0&&p<c.marche*0.8)al.push(['blue',`Vous êtes ${Math.round((1-p/c.marche)*100)} % sous le marché : vous pourriez augmenter le prix.`]);
 if(p>0&&p>=c.m1&&!(c.marche>0&&p>c.marche*1.2))al.push(['green',`Prix rentable ✓ — marge ${eur(p-c.base)} (${Math.round((p-c.base)/p*100)} % du prix).`]);
 return `<h3>Composition et coût de revient</h3>${c.det.length?`<div class="scroll"><table class="t"><tr><th>Article</th><th class="r">Qté</th><th class="r">Coût unit.</th><th class="r">Total</th></tr>${c.det.map(x=>`<tr><td>${esc(x.it.name)}${x.t==='materiel'?`<br><small class="muted">${x.am?'déjà rentabilisé → non compté':'matériel : prix ÷ '+N_AMORT()}</small>`:''}</td><td class="r">${nf(x.qty)}</td><td class="r">${eur(x.u)}</td><td class="r">${eur(x.v)}</td></tr>`).join('')}</table></div>`:'<div class="muted">Choisissez des articles ci-dessus.</div>'}
 <table class="t" style="margin-top:8px"><tr><td>Articles consommés</td><td class="r">${eur(c.art)}</td></tr><tr><td>Matériel (part non rentabilisée)</td><td class="r">${eur(c.mat)}</td></tr><tr><td>Main-d'œuvre (${nf(PK.calc.heures)} h × ${eur(s.taux)})</td><td class="r">${eur(c.mo)}</td></tr><tr><td>Déplacement (${nf(PK.calc.km)} km)</td><td class="r">${eur(c.dep)}</td></tr><tr><td>Frais généraux</td><td class="r">${eur(c.frais)}</td></tr><tr><td><b>Coût de revient total</b></td><td class="r"><b>${eur(c.base)}</b></td></tr></table>
 <h3 style="margin-top:14px">Prix de vente conseillé</h3>
 ${meth('1. Coût complet + bénéfice',`Coût de revient + ${c.marge} % (méthode conseillée)`,c.m1)}${meth('2. Achats × coefficient',`Articles × ${num(s.coef)} (contrôle rapide)`,c.m2)}${meth('3. Temps de travail','Heures × taux horaire + frais du projet',c.m3)}${c.marche>0?meth('4. Prix du marché','Prestation équivalente dans votre région',c.marche):''}
 <div style="margin-top:8px">${al.map(a=>`<div class="alert a-${a[0]}">${a[1]}</div>`).join('')}</div>`}
function vPack(){if(!PK)return empty('Aucun pack en cours.','<button data-go="cat">Retour</button>');const s=S.settings,k=PK.calc;

 const cat=S.catalog.filter(c=>c.active!==false&&c.cat!=='a_classer').map(c=>c.name+(num(c.price)?' — '+nf(c.price)+' €':''));
 const r=await api('/functions/v1/lire-ticket',{body:{mode:'devis',image:b64,media_type:mt,articles:cat}});
 const k=r.client||{},tel=waNum(k.telephone||''),nm=norm([k.prenom,k.nom].join(' '));
 let c=S.clients.find(x=>(tel.length>6&&waNum(x.tel)===tel)||(k.email&&norm(x.email)===norm(k.email))||(nm&&norm([x.prenom,x.nom].join(' '))===nm)||(k.societe&&norm(x.societe)===norm(k.societe)));
 const isNew=!c;
 if(!c&&(nm||k.societe||tel)){c={id:uid(),type:k.type==='entreprise'?'entreprise':'particulier',prenom:k.prenom||'',nom:k.nom||'',societe:k.societe||'',tel:k.telephone||'',email:k.email||'',adresse:k.adresse||'',cp:k.code_postal||'',ville:k.ville||'',tva:k.tva||'',source:'',created:Date.now(),photos:[]};await save('clients',c)}
 const d=blankDoc('devis',c?c.id:'');const SM=stockMap();
 if(/^\d{4}-\d\d-\d\d$/.test((r.evenement||{}).date||''))d.eventDate=r.evenement.date;
 d.eventPlace=(r.evenement||{}).lieu||'';d.notes=r.remarques||'';
 for(const x of r.lignes||[]){if(!String(x.designation||'').trim())continue;const qty=num(x.quantite)||1;
  const it=x.article_existant&&S.catalog.find(a=>norm(a.name)===norm(x.article_existant));
  if(it){const l={id:uid(),itemId:it.id,kind:it.kind,name:it.name,desc:it.desc||'',unit:it.unit||'',qty,price:num(x.prix_unitaire)||num(it.price),cost:unitCost(it,SM)};if(it.kind==='pack')l.comp=clone(it.comp||[]);d.lines.push(l)}
  else d.lines.push({id:uid(),kind:'free',name:String(x.designation).trim(),desc:'',unit:'',qty,price:r2(num(x.prix_unitaire)),cost:0})}
 return{d,client:c,isNew,doutes:r.doutes||''}}

 const ex=x.article_existant&&articles().find(a=>norm(a.name)===norm(x.article_existant));
 const sn=norm(String(x.sous_categorie||'').split('›').pop()),sb=cat&&sn&&subs().find(s=>s.parent===cat&&norm(s.name)===sn);
 return{id:uid(),name:String(x.nom).trim(),qty:num(x.quantite)||1,unitPrice:r2(num(x.prix_unitaire)),itemId:pro&&ex?ex.id:'',pro,frais:pro&&x.type==='frais',sugg:pro&&cat?{cat,sub:sb?sb.id:''}:null}})}

let readingTickets=false;
async function readPendingTickets(){if(readingTickets)return;readingTickets=true;
 try{for(const e of S.expenses.filter(x=>x.aLire&&x.file&&String(x.file.data).startsWith('data:')).slice(0,5)){
  let r;try{r=await readTicket(e.file)}catch(err){if(err.offline||err.auth)return;e.aLire=false;e.aVerifier=true;e.aiNote='Lecture automatique impossible : '+err.message;await save('expenses',e);continue}
  const cur=S.expenses.find(x=>x.id===e.id);if(!cur||!cur.aLire)continue;
  if(r.fournisseur&&!cur.fournisseur)cur.fournisseur=r.fournisseur;
  if(/^\d{4}-\d\d-\d\d$/.test(r.date||''))cur.date=r.date;
  if(PAYS.includes(r.paiement))cur.paiement=r.paiement;
  if(EXP_CATS[r.type_depense])cur.categorie=r.type_depense;
  if(!num(cur.montant)&&num(r.total))cur.montant=r2(num(r.total));
  if(!(cur.lines||[]).length)cur.lines=aiLines(r);
  if(!num(cur.montant))cur.montant=sum(cur.lines,lineAmt);
  cur.aLire=false;cur.aVerifier=true;if(r.remarque)cur.aiNote=r.remarque;
  await addExpense(cur);toast(`🤖 Ticket ${cur.fournisseur||''} lu : à vérifier dans Dépenses`);Sync.changed=true}}
 finally{readingTickets=false}}

function nWords(n){n=Math.floor(n);const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],T=['','','vingt','trente','quarante','cinquante','soixante','septante','quatre-vingt','nonante'];
 const lt100=x=>{if(x<20)return U[x];const t=Math.floor(x/10),r=x%10;if(t===8&&!r)return 'quatre-vingts';return T[t]+(r===1&&t<8?' et un':r?'-'+U[r]:'')};
 const lt1000=x=>{const h=Math.floor(x/100),r=x%100;let w=h?(h===1?'cent':U[h]+(r?' cent':' cents')):'';if(r)w+=(w?' ':'')+lt100(r);return w||'zéro'};
 if(n<1000)return lt1000(n);if(n<1e6){const k=Math.floor(n/1000),r=n%1000;return (k===1?'mille':lt1000(k).replace(/cents$/,'cent')+' mille')+(r?' '+lt1000(r):'')}
 const m=Math.floor(n/1e6),r=n%1e6;return lt1000(m)+' million'+(m>1?'s':'')+(r?' '+nWords(r):'')}
function amountWords(a){a=r2(Math.abs(a));const e=Math.floor(a),c=Math.round((a-e)*100);return `${nWords(e)} euro${e>1?'s':''}${c?` et ${nWords(c)} centime${c>1?'s':''}`:''}`}

/* ================= Migration depuis la version 1 ================= */
async function migrate(){
 for(const c of S.catalog){let ch=false;
  if(c.kind==='forfait'){c.kind='pack';c.comp=c.comp||[];c.calc={heures:c.calc?.heures??'',km:c.calc?.km??'',frais:c.calc?.frais??S.settings.fraisFixe,marge:c.calc?.marge??S.settings.marge,marche:c.calc?.marche??''};ch=true}
  else if(c.kind==='supplement'){c.kind='article';c.cat='service';c.cost=num(c.cost);c.stockAdj=0;ch=true}
  if(ch)await save('catalog',c)}
 for(const e of S.expenses){if(e.categorie==='conso'||e.categorie==='materiel'){const wasMat=e.categorie==='materiel';e.categorie='achats';e.lines=e.lines||[];
  if(wasMat&&!e.lines.length){const it={...newArticleObj('materiel'),name:e.materialName||e.note||e.fournisseur||'Matériel',cost:r2(num(e.montant)),supplier:e.fournisseur||'',created:Date.now()};await save('catalog',it);e.lines=[{id:uid(),name:it.name,qty:1,unitPrice:it.cost,itemId:it.id}]}
  await save('expenses',e)}}
 // v3 : 2 catégories de stock + sous-catégories
 const s=S.settings;let ch=false;
 if(!Array.isArray(s.subs)){s.subs=DEFAULT_SUBS.map(([p,n])=>({id:'s'+uid(),parent:p,name:n}));
  (s.cats||[]).forEach(c=>{if(!TOP.some(t=>t.id===c.id)&&articles().some(a=>a.cat===c.id))s.subs.push({id:c.id,parent:c.type==='materiel'?'materiel':c.type==='service'?'service':'consommable',name:c.name.replace(/\s*\(.*\)$/,'')})});ch=true}
 for(const a of articles()){let mod=false;
  if(!TOP.some(t=>t.id===a.cat)){const sb=s.subs.find(x=>x.id===a.cat);a.sub=sb?sb.id:'';a.cat=sb?sb.parent:'a_classer';mod=true}
  if(!a.v3){autoSub(a);if(a.priceManual===undefined){const sp=suggestedPrice(catOf(a).type,a.cost);a.priceManual=num(a.price)>0&&Math.abs(num(a.price)-sp)>0.005}autoPrice(a);a.v3=true;mod=true}
  if(mod)await save('catalog',a)}
 if(!Array.isArray(s.fg)){s.fg=DEFAULT_FG.map(n=>({id:uid(),name:n,amount:0,period:'mois',on:true}));ch=true}
 if(ch)await saveSettings();
}

async function acFromPhoto(img){const x=await devisFromPhoto(img),d=x.d,txt=[d.notes,...d.lines.map(l=>l.name+' '+(l.desc||''))].join(' ');
 const f=blankDoc('facture',d.clientId);f.kind='acompte';f.eventDate=d.eventDate;f.eventPlace=d.eventPlace;f.notes='';
 f.lines=d.lines.map(l=>({id:uid(),kind:'free',name:l.name,desc:l.desc||'',unit:'',qty:num(l.qty)||1,price:r2(num(l.price))}));
 let q=findQuoteNum(txt);if(!q&&d.clientId){const L=S.docs.filter(z=>z.type==='devis'&&issued(z)&&z.clientId===d.clientId&&!quoteInvoices(z).length);if(L.length===1)q=L[0]}
 if(q){f.fromQuote=q.id;f.acomptePct=acPct(q);if(!f.clientId)f.clientId=q.clientId;if(!f.eventDate)f.eventDate=q.eventDate;if(!f.eventPlace)f.eventPlace=q.eventPlace;
  if(!f.lines.length||!f.lines.some(l=>num(l.price)))f.lines=[{id:uid(),kind:'free',name:`Acompte de ${acPct(q)} % – réservation${q.eventDate?' du '+fd(q.eventDate):''}`,desc:`Selon devis ${dnum(q)}`,unit:'',qty:1,price:acompteMt(q)}]}
 if(!f.lines.length)f.lines=[{id:uid(),kind:'free',name:'Acompte à la réservation',desc:'',unit:'',qty:1,price:0}];
 return{f,q,client:x.client,isNew:x.isNew,doutes:x.doutes}}
CHG.acPhoto=async t=>{const file=t.files[0];t.value='';if(!file)return;
 if(navigator.onLine===false)return toast('Pas de réseau : la lecture demande une connexion Internet.');
 openModal('<h2>📷 Lecture de la facture d’acompte…</h2><p class="muted">Quelques secondes : l’appli lit le client, le devis et le montant.</p>');
 try{const img=await compressImage(file,1600,0.8),x=await acFromPhoto(img);closeModal();
  if(x.q){x.q.decision='accepte';x.q.acompteId=x.f.id;await save('docs',x.q)}await save('docs',x.f);
  ED=clone(x.f);VIEW='editor';F.pickQ='';render();window.scrollTo(0,0);
  alert(['Facture d’acompte préparée à partir de la photo : vérifiez le montant, puis émettez-la pour lui donner son numéro officiel.',
   x.q?`Liée au devis ${dnum(x.q)}.`:'Aucun devis trouvé : elle n’est liée à aucun devis.',
   x.client?(x.isNew?`Nouveau client créé : ${clientName(x.client)} (vérifiez sa fiche).`:`Client reconnu : ${clientName(x.client)}.`):'Client non trouvé : choisissez-le dans la liste.',
   x.f.lines.some(l=>!num(l.price))?'Le montant n’a pas été lu : complétez-le.':'',x.doutes?'À vérifier : '+x.doutes:''].filter(Boolean).join('\n\n'))}
 catch(e){openModal(`<h2>Lecture impossible</h2><p>${esc(e.message)}</p><div class="row" style="justify-content:flex-end"><button data-act="closeModal">Fermer</button></div>`)}};
{const st=document.createElement('style');st.textContent=`.pblk{display:grid;gap:8px;margin-top:10px}.pbtn{display:grid;grid-template-columns:34px 1fr;align-items:center;text-align:left;gap:0 8px;padding:12px;margin:0;min-height:0;border-radius:var(--radius);color:var(--ink)}.pbtn span{grid-row:1/3;font-size:24px}.pbtn small{font-weight:400}.pbtn:disabled{opacity:.55}
@media print{.pnote{display:block}}`;document.head.appendChild(st)}
/* ================= v12 : fichier Peppol (UBL, Peppol BIS Billing 3.0) pour les factures et notes de crédit aux entreprises ================= */
const xe=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const a2=v=>(Math.round(num(v)*100)/100).toFixed(2);
const bceDigits=v=>{const d=String(v||'').replace(/[^0-9]/g,'');return d.length===9?'0'+d:d};
const isProClient=c=>!!c&&(c.type==='entreprise'||!!c.tva);
function splitCpVille(t){const m=String(t||'').trim().match(/^(\d{4})\s*(.*)$/);return m?{cp:m[1],ville:m[2]}:{cp:'',ville:String(t||'').trim()}}
function peppolCheck(d){const s=S.settings,c=clientById(d.clientId)||{},E=[];
 if(!d.number)E.push('la facture doit être émise (avec son numéro)');
 if(bceDigits(s.bce).length!==10)E.push('votre n° d’entreprise (BCE) dans Réglages');
 if(!s.nom)E.push('le nom de votre entreprise dans Réglages');
 if(bceDigits(c.tva).length!==10)E.push('le n° d’entreprise / TVA du client (fiche client)');
 if(!(c.societe||clientName(c)))E.push('le nom du client');
 return E}
function peppolXML(d){const s=S.settings,c=clientById(d.clientId)||{},nc=d.type==='nc',T=docTotal(d),L=d.lines||[];
 const sb=bceDigits(s.bce),cb=bceDigits(c.tva),sa=splitCpVille(s.cpVille);
 const mention=s.mention||'Régime particulier de franchise des petites entreprises';
 const sg=nc?-1:1; // une note de crédit est écrite en montants positifs
 const reg=L.filter(l=>!l.deduct),ded=L.filter(l=>l.deduct);
 const lines=reg.map((l,i)=>{let q=num(l.qty)||1,p=num(l.price)*sg;if(p<0){p=-p;q=-q}const amt=r2(q*p);return{i:i+1,q,p,amt,l}});
 const lineExt=r2(sum(lines,x=>x.amt)),rem=r2(T.rem*sg),excl=r2(lineExt-rem),prepaid=r2(-sum(ded,lineTotal)*sg),pay=r2(excl-prepaid);
 const party=(ep,name,adr,cp,ville,vat,legal)=>`<cac:Party><cbc:EndpointID schemeID="0208">${ep}</cbc:EndpointID><cac:PartyName><cbc:Name>${xe(name)}</cbc:Name></cac:PartyName>
<cac:PostalAddress>${adr?`<cbc:StreetName>${xe(adr)}</cbc:StreetName>`:''}${ville?`<cbc:CityName>${xe(ville)}</cbc:CityName>`:''}${cp?`<cbc:PostalZone>${xe(cp)}</cbc:PostalZone>`:''}<cac:Country><cbc:IdentificationCode>BE</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
${vat?`<cac:PartyTaxScheme><cbc:CompanyID>BE${vat}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>`:''}<cac:PartyLegalEntity><cbc:RegistrationName>${xe(legal||name)}</cbc:RegistrationName><cbc:CompanyID schemeID="0208">${ep}</cbc:CompanyID></cac:PartyLegalEntity></cac:Party>`;
 const cat=`<cbc:ID>E</cbc:ID><cbc:Percent>0</cbc:Percent>`;
 const ref=nc?S.docs.find(x=>x.id===d.refInvoice):null,root=nc?'CreditNote':'Invoice',q=S.docs.find(x=>x.id===d.fromQuote);
 const cname2=c.societe||clientName(c),comm=d.type==='facture'?'Facture '+d.number:d.number;
 return `<?xml version="1.0" encoding="UTF-8"?>
<${root} xmlns="urn:oasis:names:specification:ubl:schema:xsd:${root}-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
<cbc:CustomizationID>urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0</cbc:CustomizationID>
<cbc:ProfileID>urn:fdc:peppol.eu:2017:poacc:billing:01:1.0</cbc:ProfileID>
<cbc:ID>${xe(d.number)}</cbc:ID>
<cbc:IssueDate>${d.date}</cbc:IssueDate>
${!nc&&d.dueDate?`<cbc:DueDate>${d.dueDate}</cbc:DueDate>`:''}<cbc:${nc?'CreditNoteTypeCode':'InvoiceTypeCode'}>${nc?381:380}</cbc:${nc?'CreditNoteTypeCode':'InvoiceTypeCode'}>
<cbc:Note>${xe(mention)}${d.kind==='acompte'?' – Facture d’acompte':''}${d.eventDate?' – Événement du '+fd(d.eventDate)+(d.eventPlace?', '+d.eventPlace:''):''}</cbc:Note>
<cbc:DocumentCurrencyCode>EUR</cbc:DocumentCurrencyCode>
<cbc:BuyerReference>${xe(q&&q.number?q.number:d.number)}</cbc:BuyerReference>
${ref&&ref.number?`<cac:BillingReference><cac:InvoiceDocumentReference><cbc:ID>${xe(ref.number)}</cbc:ID>${ref.date?`<cbc:IssueDate>${ref.date}</cbc:IssueDate>`:''}</cac:InvoiceDocumentReference></cac:BillingReference>`:''}
<cac:AccountingSupplierParty>${party(sb,s.nom,s.adresse,sa.cp,sa.ville,sb,s.titulaire?s.nom:s.nom)}</cac:AccountingSupplierParty>
<cac:AccountingCustomerParty>${party(cb,cname2,c.adresse,c.cp,c.ville,cb,cname2)}</cac:AccountingCustomerParty>
${!nc&&s.iban?`<cac:PaymentMeans><cbc:PaymentMeansCode>58</cbc:PaymentMeansCode><cbc:PaymentID>${xe(comm)}</cbc:PaymentID><cac:PayeeFinancialAccount><cbc:ID>${xe(String(s.iban).replace(/\s+/g,''))}</cbc:ID>${s.titulaire||s.nom?`<cbc:Name>${xe(s.titulaire||s.nom)}</cbc:Name>`:''}</cac:PayeeFinancialAccount></cac:PaymentMeans>`:''}
${rem?`<cac:AllowanceCharge><cbc:ChargeIndicator>false</cbc:ChargeIndicator><cbc:AllowanceChargeReason>Remise ${num(d.remise)} %</cbc:AllowanceChargeReason><cbc:Amount currencyID="EUR">${a2(rem)}</cbc:Amount><cac:TaxCategory>${cat}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory></cac:AllowanceCharge>`:''}
<cac:TaxTotal><cbc:TaxAmount currencyID="EUR">0.00</cbc:TaxAmount><cac:TaxSubtotal><cbc:TaxableAmount currencyID="EUR">${a2(excl)}</cbc:TaxableAmount><cbc:TaxAmount currencyID="EUR">0.00</cbc:TaxAmount><cac:TaxCategory>${cat}<cbc:TaxExemptionReason>${xe(mention)}</cbc:TaxExemptionReason><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal></cac:TaxTotal>
<cac:LegalMonetaryTotal><cbc:LineExtensionAmount currencyID="EUR">${a2(lineExt)}</cbc:LineExtensionAmount><cbc:TaxExclusiveAmount currencyID="EUR">${a2(excl)}</cbc:TaxExclusiveAmount><cbc:TaxInclusiveAmount currencyID="EUR">${a2(excl)}</cbc:TaxInclusiveAmount>${rem?`<cbc:AllowanceTotalAmount currencyID="EUR">${a2(rem)}</cbc:AllowanceTotalAmount>`:''}${prepaid?`<cbc:PrepaidAmount currencyID="EUR">${a2(prepaid)}</cbc:PrepaidAmount>`:''}<cbc:PayableAmount currencyID="EUR">${a2(pay)}</cbc:PayableAmount></cac:LegalMonetaryTotal>
${lines.map(x=>`<cac:${nc?'CreditNoteLine':'InvoiceLine'}><cbc:ID>${x.i}</cbc:ID><cbc:${nc?'CreditedQuantity':'InvoicedQuantity'} unitCode="C62">${+x.q.toFixed(3)}</cbc:${nc?'CreditedQuantity':'InvoicedQuantity'}><cbc:LineExtensionAmount currencyID="EUR">${a2(x.amt)}</cbc:LineExtensionAmount><cac:Item>${x.l.desc?`<cbc:Description>${xe(x.l.desc)}</cbc:Description>`:''}<cbc:Name>${xe(x.l.name||'Prestation')}</cbc:Name><cac:ClassifiedTaxCategory>${cat}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory></cac:Item><cac:Price><cbc:PriceAmount currencyID="EUR">${a2(x.p)}</cbc:PriceAmount></cac:Price></cac:${nc?'CreditNoteLine':'InvoiceLine'}>`).join('\n')}
</${root}>`}
ACT.peppolDl=d=>{const x=S.docs.find(z=>z.id===d.id);if(!x)return;const E=peppolCheck(x);
 if(E.length)return openModal(`<h2>📤 Fichier Peppol</h2><p>Il manque encore :</p><ul>${E.map(e=>`<li>${e}</li>`).join('')}</ul><div class="row" style="justify-content:flex-end"><button data-act="closeModal">Fermer</button></div>`);
 const xml=peppolXML(x),c=clientById(x.clientId)||{},u=URL.createObjectURL(new Blob([xml],{type:'application/xml'})),a=document.createElement('a');
 a.href=u;a.download=`${x.type==='nc'?'Note de credit':'Facture'} ${x.number} ${c.societe||clientName(c)} - Peppol.xml`.replace(/[\\/:*?"<>|]+/g,'-');document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);
 if(!x.peppolAt){x.peppolAt=todayISO();save('docs',x)}
 openModal(`<h2>📤 Fichier Peppol téléchargé</h2><p>Envoyez maintenant ce fichier à votre client par votre outil Peppol (Cegid, Hermes…) : choisissez <b>importer une facture UBL</b>, puis envoyez-la.</p><p class="muted"><small>Le fichier contient la facture au format européen Peppol BIS Billing 3.0, en franchise de TVA (mention « ${esc(S.settings.mention||'Régime particulier de franchise des petites entreprises')} »).</small></p><div class="row" style="justify-content:flex-end"><button class="pri" data-act="closeModal">OK</button></div>`)};
{const _d=vDoc;vDoc=function(){let h=_d();const d=S.docs.find(z=>z.id===PARAM);if(!d||(d.type!=='facture'&&d.type!=='nc')||!d.number)return h;const c=clientById(d.clientId);if(!isProClient(c))return h;
 h=h.replace('<div class="row" style="margin-bottom:14px">',`<div class="row" style="margin-bottom:14px"><button class="pri" data-act="peppolDl" data-id="${d.id}">📤 Fichier Peppol</button>`);
 return h.replace('Encodez-la aussi dans votre solution Peppol.',`Touchez <b>📤 Fichier Peppol</b> puis importez le fichier dans votre outil Peppol (Cegid, Hermes…).${d.peppolAt?' <i>Fichier téléchargé le '+fd(d.peppolAt)+'.</i>':''}`)}}

/* ================= Démarrage ================= */
async function loadLocal(){const st=await DB.all('settings');
 for(const s of ['clients','catalog','expenses','docs'])S[s]=await DB.all(s);
 S.settings={...DEFAULT_SETTINGS,...(st.find(x=>x.id==='main')||{})};return st.length}
async function boot(){
 if(Sync.on&&!Sync.ready){
  document.body.classList.add('locked');Sync.badge();
  if(!Auth.s){$('#app').innerHTML=vLogin();return}
  $('#app').innerHTML='<div class="empty">⏳ Téléchargement de vos données…<br><small>(la première fois, cela peut prendre une minute si vous avez beaucoup de photos)</small></div>';
  await Sync.run();
  if(Sync.state==='auth'){Auth.set(null);Sync.badge()}
  if(Sync.state!=='ok'){$('#app').innerHTML=Auth.s?`<div class="card" style="max-width:460px;margin:30px auto"><h2>Connexion au serveur impossible</h2><p>${esc(Sync.err)}</p><p class="muted">Vérifiez que l'appareil est connecté à Internet.</p><button class="pri" data-act="retryBoot">Réessayer</button></div>`:vLogin();
   if(!Auth.s)$('#loginMsg').textContent=Sync.err;return}
  Sync.ready=true;await Sync.setMeta('ready',1);document.body.classList.remove('locked');
  const isEmpty=!S.docs.length&&!S.expenses.length&&!S.catalog.length&&!S.clients.length;
  await migrate();render();Sync.start();if(isEmpty)openWelcome();return}
 await migrate();render();if(Sync.on)Sync.start();
}
(async function init(){
 await DB.open();
 if(DB.failed)Sync.on=false;
 const n=await loadLocal();
 if(Sync.on)Sync.ready=!!(await Sync.meta('ready'));
 if(!n&&!(Sync.on&&!Sync.ready))await saveSettings();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!CFG.noServiceWorker)navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
 await boot();
})();
</script>
