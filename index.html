<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c2457a">
<title>Ma Déco Pro – Gestion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf6f4;--card:#fff;--ink:#2b2430;--muted:#7a7180;--line:#ece3e7;--accent:#c2457a;--accent-soft:#fbe9f1;--gold:#c99634;--green:#2e8b57;--red:#c0392b;--orange:#d9822b;--blue:#3b6fb6;--radius:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:90px}
header.top{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{flex:1 0 auto;min-width:72px;border:0;background:none;padding:8px 6px 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:0;border-radius:0}
nav#nav button span{font-size:20px;line-height:1}
nav#nav button.on{color:var(--accent);font-weight:700}
@media(min-width:900px){
 body{padding-bottom:20px;padding-left:200px}
 nav#nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:60px}
 nav#nav button{flex:0 0 auto;flex-direction:row;font-size:15px;gap:10px;padding:12px 18px;justify-content:flex-start}
 header.top{margin-left:-200px;padding-left:216px}
}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:4px 0 14px;font-size:21px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px}
.kpi.hl{background:var(--accent-soft);border-color:#f3c9db}
.muted{color:var(--muted)}
small{font-size:12.5px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
button:hover{border-color:#d8c4cd}
.pri{background:var(--accent);border-color:var(--accent);color:#fff!important;font-weight:600}
.danger{color:var(--red);border-color:#f1c9c4}
.sm{padding:5px 10px;min-height:32px;font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:0;min-height:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
label.f{margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:9px 10px;border:1px solid #ddd2d7;border-radius:9px;background:#fff;margin-top:3px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #f0bcd3;border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.list .it{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.list .it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-grey{background:#efedf0;color:#5d5862}.b-green{background:#e3f4ea;color:#21704a}.b-red{background:#fbe5e2;color:#a8311f}.b-orange{background:#fdf0e1;color:#a65f12}.b-blue{background:#e5eef9;color:#2c5794}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#f2ecef;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border-radius:20px;padding:6px 13px;min-height:34px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gauge{height:16px;background:#f0eaee;border-radius:10px;overflow:hidden;margin:8px 0 4px}
.gauge div{height:100%;border-radius:10px}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.a-red{background:#fbe5e2;color:#8e2617}.a-orange{background:#fdf0e1;color:#8a4e0f}.a-blue{background:#e5eef9;color:#244a80}.a-green{background:#e3f4ea;color:#1c5e3e}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 4px}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
table.t input{margin:0;padding:6px 8px}
.scroll{overflow-x:auto}
.chart{width:100%;height:auto}
.chart .gl{stroke:#eee6ea}.chart .ax{font-size:11px;fill:#8a8590}.chart .b1{fill:var(--accent)}.chart .b2{fill:var(--gold)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* vignettes */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px #f3c9db}
.tile.click{cursor:pointer}
.tile[draggable=true]{cursor:grab}
.tile .img{aspect-ratio:4/3;background:#f4eef1;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile .bd{padding:8px 9px;flex:1;display:flex;flex-direction:column;gap:2px}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .st{font-size:12px;color:var(--muted);line-height:1.35}
.tile .warn{color:var(--red);font-size:12px;font-weight:600}
.tile .warn:empty{display:none}
.tile .tag{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.92);border-radius:12px;font-size:11px;padding:1px 8px;font-weight:600}
.stepper{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:6px}
.stepper button{min-height:34px;width:34px;flex:0 0 34px;justify-content:center;padding:0;font-size:18px}
.stepper input{margin:0;text-align:center;padding:6px 2px;min-width:0}
.tile select{margin-top:6px;padding:5px 6px;font-size:12.5px}
.dropzone{min-height:80px;border:2px dashed transparent;border-radius:12px;padding:4px;transition:background .15s,border-color .15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .hint{color:var(--muted);font-size:13px;text-align:center;padding:18px 6px;border:2px dashed var(--line);border-radius:10px}
.subcat{margin-bottom:12px}.subcat>.row{margin:6px 0}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.typeopt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink);margin:0;font-size:14px}
.typeopt.on{border-color:var(--accent);background:var(--accent-soft)}
.typeopt small{display:block;color:var(--muted);font-size:12px}
.typeopt input{margin-top:2px}
.dl{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.dl input{margin-top:3px}
.dl .grow{flex:1;min-width:0}
.dl .dlt{font-weight:600}
.dl .dlr{text-align:right;white-space:nowrap;font-size:13.5px}
.dl.late{background:#fff4f2}
.dl.done{opacity:.55}
.dlm{font-weight:700;color:var(--muted);text-transform:capitalize;margin:12px 0 2px;font-size:13px}
.chk input{margin-top:2px}
.catsec{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;background:#fff}
.catsec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;border-radius:var(--radius);user-select:none}
.catsec>summary::-webkit-details-marker{display:none}
.catsec .chev{display:inline-block;transition:transform .15s;font-size:14px;color:var(--muted);width:14px}
.catsec[open] .chev{transform:rotate(90deg)}
.catsec .secbody{padding:0 14px 6px}
.catsec.sec-consommable{background:#fdeef4;border-color:#f3cfdf}
.catsec.sec-materiel{background:#eaf6ee;border-color:#c8e6d2}
.catsec.sec-service{background:#f3f1f5}
.catsec.sec-a_classer{background:#fff7ec;border-color:#f0c48a}
.dropsum.over{outline:2px dashed var(--accent);outline-offset:-4px}
.catsec .dropzone .hint{background:rgba(255,255,255,.55)}
.catcard.todo{border-color:#f0c48a;background:#fffaf2}
.totalbar{position:sticky;bottom:70px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 4px 18px rgba(60,20,40,.08);z-index:10}
@media(min-width:900px){.totalbar{bottom:12px}}
@media(max-width:600px){.totalbar{padding:8px 10px}.totalbar .tot{font-size:18px}.totalbar button{padding:6px 10px;min-height:36px;font-size:13.5px}}
.totalbar .tot{font-size:20px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(30,15,25,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:720px;padding:18px;margin:auto 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.photos .ph{position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;cursor:pointer}
.photos .ph button{position:absolute;top:4px;right:4px;min-height:0;padding:2px 7px;font-size:12px}
.preview-img{max-width:100%;max-height:70vh;display:block;margin:0 auto 10px;border-radius:8px}
.method{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.method:last-child{border-bottom:0}
.eline{display:grid;grid-template-columns:1fr 64px 84px 84px 34px;gap:6px;align-items:center;margin-bottom:6px}
.eline input,.eline select{margin:0;padding:7px 7px}
.eline .lk{grid-column:1/5}
@media(max-width:560px){.eline{grid-template-columns:1fr 1fr 1fr 34px}.eline .nm{grid-column:1/5}.eline .lk{grid-column:1/5}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.05);padding:28px;overflow-x:auto}
/* ===== Document imprimable ===== */
.inv{position:relative;font-size:13px;color:#222;min-width:560px}
.inv .wm{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:84px;font-weight:800;color:rgba(194,69,122,.10);transform:rotate(-18deg);pointer-events:none}
.inv-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
.inv-from{display:flex;gap:14px;align-items:flex-start}
.inv-logo{max-width:110px;max-height:90px;object-fit:contain}
.inv-name{font-size:16px}
.inv-title{font-size:24px;font-weight:800;color:var(--accent);letter-spacing:.5px;margin-bottom:6px;text-align:right}
.inv-meta table td{padding:1px 0 1px 12px;text-align:right}
.inv-meta table td:first-child{color:#777}
.inv-to{margin-left:auto;width:48%;border:1px solid #e5dde1;border-radius:8px;padding:10px 12px;margin-bottom:16px}
.inv-to .lbl{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.5px;margin-bottom:3px}
.inv-ev{margin-bottom:12px}
.inv table.lines{width:100%;border-collapse:collapse;margin-bottom:12px}
.inv table.lines th{background:#f6eef2;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:7px 8px}
.inv table.lines td{padding:7px 8px;border-bottom:1px solid #eee;vertical-align:top}
.inv table.lines .r{text-align:right;white-space:nowrap}
.inv table.lines small{color:#777;display:block}
.inv-tot{margin-left:auto;width:52%;border-collapse:collapse}
.inv-tot td{padding:4px 8px}
.inv-tot td:last-child{text-align:right;white-space:nowrap}
.inv-tot tr.big td{font-size:16px;font-weight:800;border-top:2px solid #222;padding-top:7px}
.inv-mention{margin-top:16px;font-weight:700;border:1px solid #e5dde1;background:#fbf7f9;padding:8px 10px;border-radius:6px}
.inv-pay,.inv-notes,.inv-cond{margin-top:12px;white-space:pre-line}
.inv-sign{margin-top:22px;display:flex;justify-content:flex-end}
.inv-sign div{width:45%;border:1px dashed #bbb;border-radius:6px;height:90px;padding:8px;font-size:12px;color:#666}
.inv-foot{margin-top:26px;border-top:1px solid #eee;padding-top:8px;font-size:11px;color:#888;text-align:center}
.pk-photo{max-width:100%;max-height:320px;border-radius:8px;display:block;margin:10px 0}
/* synchronisation */
.syncb{border:0;background:rgba(255,255,255,.18);color:#fff!important;border-radius:16px;padding:4px 11px;min-height:0;font-size:12.5px;line-height:1.2;display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto;white-space:nowrap;margin-left:10px}
.syncb small{font-size:10.5px;opacity:.9;font-weight:400}
.syncb.warn{background:#fff3cd;color:#7a4b00!important}
.syncb.off{background:rgba(0,0,0,.22)}
.syncb[hidden]{display:none}
body.locked nav#nav{display:none}
body.locked{padding-left:0!important}
@media(min-width:900px){body.locked header.top{margin-left:0;padding-left:16px}}
#printArea{display:none}
@page{size:A4;margin:12mm}
@media print{
 body{background:#fff;padding:0!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 .inv{min-width:0;font-size:11.5pt}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top"><div class="brand" id="brandName">Ma Déco Pro</div><button id="syncBadge" class="syncb" data-act="syncInfo" hidden></button></header>
<nav id="nav">
 <button data-go="dash" data-view="dash"><span>📊</span>Tableau</button>
 <button data-go="agenda" data-view="agenda"><span>📅</span>Échéances</button>
 <button data-go="docs" data-view="docs"><span>🧾</span>Factures</button>
 <button data-go="cat" data-view="cat"><span>🎈</span>Catalogue</button>
 <button data-go="exp" data-view="exp"><span>📷</span>Dépenses</button>
 <button data-go="cli" data-view="cli"><span>👥</span>Clients</button>
 <button data-go="mat" data-view="mat"><span>🧰</span>Matériel</button>
 <button data-go="set" data-view="set"><span>⚙️</span>Réglages</button>
</nav>
<main id="app"><div class="empty">Chargement…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box"><div id="modalBody"></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
'use strict';
/* ================= Outils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const EUR=new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(+n||0);
const r2=n=>Math.round((+n||0)*100)/100;
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?0:x};
const nf=n=>String(+(+n||0).toFixed(2)).replace('.',',');
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fd=iso=>iso?iso.split('-').reverse().join('/'):'';
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const MONTHS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const sum=(a,f)=>r2(a.reduce((s,x)=>s+(f?f(x):x),0));
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}

/* ================= Stockage local (IndexedDB) ================= */
const STORES=['settings','clients','catalog','expenses','docs'];
// stores internes : file d'attente des envois, état de la synchro, photos déjà en ligne
const SYS={outbox:'k',meta:'k',files:'h'};
let _lastTs=0;const nowTs=()=>(_lastTs=Math.max(Date.now(),_lastTs+1));
const DB={db:null,mem:null,
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('decoGestion',2);
   r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});
    for(const[s,k]of Object.entries(SYS))if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:k})};
   r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){console.warn(e);this.mem={};STORES.forEach(s=>this.mem[s]=new Map());this.failed=true}},
 req(store,mode,fn){return new Promise((res,rej)=>{const r=fn(this.db.transaction(store,mode).objectStore(store));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 all(s){return this.mem?Promise.resolve([...this.mem[s].values()]):this.req(s,'readonly',o=>o.getAll())},
 get(s,k){return this.mem?Promise.resolve(this.mem[s]&&this.mem[s].get(k)):this.req(s,'readonly',o=>o.get(k))},
 // écritures « brutes » : sans les signaler à la synchro (utilisées par la synchro elle-même)
 raw(s,v){return this.req(s,'readwrite',o=>o.put(v))},
 rawDel(s,k){return this.req(s,'readwrite',o=>o.delete(k))},
 async put(s,v){if(this.mem){this.mem[s].set(v.id,clone(v));return}v._ts=nowTs();await this.req(s,'readwrite',o=>o.put(v));await Sync.mark(s,v.id,v._ts)},
 async del(s,id){if(this.mem){this.mem[s].delete(id);return}await this.req(s,'readwrite',o=>o.delete(id));await Sync.mark(s,id,nowTs(),{del:true})},
 async clear(s){if(this.mem){this.mem[s].clear();return}
  if(Sync.ready&&STORES.includes(s))for(const r of await this.all(s))await Sync.mark(s,r.id,nowTs(),{del:true,purge:true});
  return this.req(s,'readwrite',o=>o.clear())},
 wipe(){try{this.db&&this.db.close()}catch(e){}return new Promise(res=>{const r=indexedDB.deleteDatabase('decoGestion');r.onsuccess=r.onerror=r.onblocked=()=>res()})}
};

/* ================= Synchronisation en ligne (Supabase) ================= */
const CFG=window.MDP_CONFIG||{};
const SB=CFG.supabaseUrl&&CFG.supabaseKey&&!/COLLER|VOTRE/i.test(CFG.supabaseUrl+CFG.supabaseKey)?{url:String(CFG.supabaseUrl).trim().replace(/\/+$/,''),key:String(CFG.supabaseKey).trim()}:null;

 if(navigator.onLine===false)throw offErr();
 for(let attempt=0;attempt<2;attempt++){const tok=await Auth.token(attempt>0),isBlob=body instanceof Blob;let r;
  try{r=await netFetch(SB.url+path,{method,headers:{apikey:SB.key,Authorization:'Bearer '+tok,...(body!==undefined&&!isBlob?{'Content-Type':'application/json'}:{}),...headers},body:body===undefined?undefined:isBlob?body:JSON.stringify(body)})}catch(e){throw offErr()}
  if(r.status===401&&attempt===0)continue;
  if(!r.ok){const t=await r.text().catch(()=>'');if(r.status===401)throw authErr('Session expirée : reconnectez-vous');
   if(r.status===403||/42501|Accès refusé/.test(t))throw authErr('Ce compte n\'est pas autorisé à utiliser cette appli');
   throw Object.assign(new Error('Erreur du serveur ('+r.status+') '+t.slice(0,160)),{status:r.status})}

}

   try{await this.push();await this.pull();await this.hydrate();this.state='ok';this.err='';this.last=Date.now();try{localStorage.setItem('mdp.last',this.last)}catch(e){}}

  for(const e of batch){if(e.del){items.push({store:e.store,id:e.id,deleted:true,data:{},client_ts:e.ts,purge:e.purge});continue}
   const rec=await DB.get(e.store,e.id);if(!rec){await DB.rawDel('outbox',e.k);continue}

async function compressImage(file,max=1600,q=0.72,type='image/jpeg'){

 return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(img,0,0,w,h);res(c.toDataURL(type,q))};
  img.onerror=()=>res(url);img.src=url});

 return M}

 const base=r2(pc.art+pc.mat+mo+dep+frais);return{...pc,mo,dep,frais,marge,base,m1:r2(base*(1+marge/100)),m2:r2(pc.art*num(s.coef)),m3:r2(mo+pc.art+pc.mat+dep),marche:num(k.marche)}}

const clientById=id=>S.clients.find(c=>c.id===id);
function clientName(c){if(!c)return '—';const p=[c.prenom,c.nom].filter(Boolean).join(' ');return c.societe||p||'Sans nom'}
const cname=id=>clientName(clientById(id));
const lineTotal=l=>r2(num(l.qty)*num(l.price));
function docTotal(d){const sub=sum(d.lines||[],lineTotal);const rem=r2(sub*num(d.remise)/100);return{sub,rem,total:r2(sub-rem)}}
const paid=d=>sum(d.payments||[],p=>num(p.amount));
function docStatus(d){
 if(pendingNum(d))return{k:'pend',l:'N° en attente',c:'orange'};
 if(d.type==='nc')return{k:'nc',l:'Note de crédit',c:'grey'};
 if(!d.number)return{k:'draft',l:'Brouillon',c:'grey'};
 if(d.type==='devis'){
  if(d.invoiceId)return{k:'fact',l:'Facturé',c:'green'};
  if(d.decision==='accepte')return{k:'acc',l:'Accepté',c:'blue'};
  if(d.decision==='refuse')return{k:'ref',l:'Refusé',c:'red'};
  if(d.validUntil&&d.validUntil<todayISO())return{k:'exp',l:'Expiré',c:'grey'};
  return d.sentDate?{k:'sent',l:'Envoyé',c:'orange'}:{k:'iss',l:'À envoyer',c:'orange'};}
 if(d.creditId)return{k:'cancel',l:'Annulée',c:'red'};
 const t=docTotal(d).total,p=paid(d);
 if(p>=t-0.005)return{k:'paid',l:'Payée',c:'green'};
 if(d.dueDate&&d.dueDate<todayISO())return{k:'late',l:p>0?'En retard (acompte reçu)':'En retard',c:'red'};
 if(p>0)return{k:'dep',l:'Acompte reçu',c:'orange'};
 return d.sentDate?{k:'sent',l:'Envoyée',c:'blue'}:{k:'iss',l:'À envoyer',c:'orange'};
}
const badge=s=>`<span class="badge b-${s.c}">${esc(s.l)}</span>`;
const TYPE_L={facture:'Facture',devis:'Devis',nc:'Note de crédit'};
const PREFIX={facture:'',devis:'D-',nc:'NC-'};
function nextNumber(type,date){const pre=PREFIX[type]+date.slice(0,4)+'-';
 const n=S.docs.filter(d=>d.type===type&&d.number&&d.number.startsWith(pre)).map(d=>parseInt(d.number.slice(pre.length))||0).reduce((a,b)=>Math.max(a,b),0);
 return pre+String(n+1).padStart(3,'0')}
const eventCost=d=>sum(d.lines||[],l=>num(l.cost)*num(l.qty));
// Cotisations sociales d'un indépendant à titre complémentaire (Belgique) + frais de gestion de la caisse (UCM)
function quartersIn(y){const st=S.settings.dateDebut;if(!st||!y)return 4;const sy=+st.slice(0,4);if(sy>y)return 0;if(sy<y)return 4;return 4-Math.floor((+st.slice(5,7)-1)/3)}
function socialCalc(benef,y){const s=S.settings,b=Math.max(0,benef),q=quartersIn(y);let cot=0,minApplied=false;const below=b<num(s.seuilCompl)||!q;
 if(!below){cot=b*num(s.cotis)/100;const mn=num(s.minTrim)*q;if(cot<mn){cot=mn;minApplied=true}}
 const gest=cot*num(s.gestion)/100,imp=Math.max(0,b-cot-gest)*num(s.impot)/100;
 return{cot:r2(cot),gest:r2(gest),imp:r2(imp),prov:r2(cot+gest+imp),minApplied,below,q}}
const DEFAULT_FG=['Comptable / logiciel de comptabilité','Assurance responsabilité civile professionnelle','Frais du compte bancaire professionnel','Terminal de paiement / Payconiq (abonnement, commissions)',
 'Téléphone et internet (part professionnelle)','Site internet, nom de domaine, hébergement','Abonnements (Canva, logiciels, applis…)','Publicité : réseaux sociaux, flyers, cartes de visite',
 'Photos et impressions pour le portfolio','Petit outillage : gonfleur, pompe, pistolet à colle, ciseaux…','Location de la bouteille d\'hélium (location / caution)','Stockage : local, garage ou part du logement',
 'Véhicule : assurance, entretien, taxe (part professionnelle)','Formations (ex. AD Events Academy)','Fournitures, emballages, housses et bacs de transport','Casse et pertes (ballons éclatés, matériel abîmé)','Frais administratifs (guichet d\'entreprise, courrier…)'];
const fgList=()=>S.settings.fg||[];
const fgYear=l=>num(l.amount)*(l.period==='an'?1:12);
const fgTotal=()=>sum(fgList().filter(l=>l.on!==false),fgYear);
const fgPerEvent=()=>r2(fgTotal()/Math.max(1,num(S.settings.eventsYear)||1));
function yearStats(y){
 const ys=String(y),inv=S.docs.filter(d=>(d.type==='facture'||d.type==='nc')&&issued(d)&&(d.date||'').startsWith(ys));
 const caFact=sum(inv,d=>docTotal(d).total);const pays=[];
 S.docs.filter(d=>d.type==='facture'&&issued(d)).forEach(d=>(d.payments||[]).forEach(p=>pays.push({...p,doc:d})));
 const py=pays.filter(p=>(p.date||'').startsWith(ys)),ex=S.expenses.filter(e=>(e.date||'').startsWith(ys));
 const encM=Array(12).fill(0),depM=Array(12).fill(0);
 py.forEach(p=>encM[+p.date.slice(5,7)-1]+=num(p.amount));ex.forEach(e=>depM[+e.date.slice(5,7)-1]+=num(e.montant));
 const enc=sum(py,p=>num(p.amount)),dep=sum(ex,e=>num(e.montant)),benef=r2(enc-dep);
 const sc=socialCalc(benef,y);
 return{inv,caFact,enc,dep,benef,...sc,encM:encM.map(r2),depM:depM.map(r2)}}

 const dls=deadlines().filter(x=>!dlDone()[x.key]&&x.date<=addDays(todayISO(),14)&&x.date>=addDays(todayISO(),-120));
 dls.forEach(x=>{const lt=x.date<todayISO();al.push([lt&&!x.optional?'red':'orange',`📅 ${lt?'En retard':'Échéance le '+fd(x.date)} : <b>${esc(x.title)}</b>${x.amount?' – '+eur(x.amount):''}${x.optional?' (facultatif)':''}. <button class="link" data-go="agenda">Voir</button>`])});
 if(!s.nom||!s.bce||!s.iban)al.push(['blue',`Complétez vos informations (nom, n° d'entreprise BCE, IBAN) pour qu'elles apparaissent sur vos factures. <button class="link" data-go="set">Réglages</button>`]);
 const top={};st.inv.filter(d=>d.type==='facture'&&!d.creditId).forEach(d=>d.lines.forEach(l=>{const k=l.name||'?';top[k]=top[k]||{q:0,a:0};top[k].q+=num(l.qty);top[k].a+=lineTotal(l)}));
 const topA=Object.entries(top).sort((a,b)=>b[1].a-a[1].a).slice(0,6);
 const events=st.inv.filter(d=>d.type==='facture'&&!d.creditId).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
 const mats=articles().filter(a=>catOf(a).type==='materiel').map(a=>matInfo(a,SM));
 const stockVal=sum(articles().filter(a=>catOf(a).type==='stock'),a=>Math.max(0,stk(a,SM).stock)*num(a.cost));
 return `<div class="row between"><h2>Tableau de bord</h2><select style="width:auto" data-inp="year">${yearsList().map(v=>opt(v,'Année '+v,y)).join('')}</select></div>

 <div class="kpis">
  <div class="kpi"><div class="l">Encaissé en ${y}</div><div class="v">${eur(st.enc)}</div></div>

  <div class="kpi"><div class="l">Provision cotisations + impôts</div><div class="v">${eur(st.prov)}</div></div>
  <div class="kpi hl"><div class="l">Réellement disponible</div><div class="v">${eur(st.benef-st.prov)}</div></div>
 </div>
 <div class="card"><div class="row between"><h3>Encaissements et dépenses par mois</h3><div class="legend"><span><i style="background:var(--accent)"></i>Encaissé</span><span><i style="background:var(--gold)"></i>Dépenses</span></div></div>${chart(st.encM,st.depM)}</div>
 <div class="grid g2">
  <div class="card"><h3>Prestations les plus vendues</h3>${topA.length?`<table class="t"><tr><th>Prestation</th><th class="r">Qté</th><th class="r">Montant</th></tr>${topA.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${nf(v.q)}</td><td class="r">${eur(v.a)}</td></tr>`).join('')}</table>`:'<div class="muted">Aucune facture émise cette année.</div>'}</div>
  <div class="card"><h3>Provision conseillée</h3><table class="t">

   <tr><td>Frais de gestion caisse UCM (${num(s.gestion)} % des cotisations)</td><td class="r">${eur(st.gest)}</td></tr>

function chart(a,b){const W=640,H=200,P=40,bw=(W-P)/12,max=Math.max(1,...a,...b);let s=`<svg viewBox="0 0 ${W} ${H+24}" class="chart" role="img" aria-label="Graphique mensuel">`;
 for(let i=0;i<=4;i++){const y=8+(H-8)*(1-i/4);s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${P-6}" y="${y+4}" text-anchor="end" class="ax">${Math.round(max*i/4)}</text>`}
 MONTHS.forEach((m,i)=>{const x=P+i*bw,h1=(H-8)*a[i]/max,h2=(H-8)*b[i]/max;
  s+=`<rect x="${x+bw*.14}" y="${H-h1}" width="${bw*.34}" height="${h1}" class="b1" rx="2"><title>${m} – encaissé ${eur(a[i])}</title></rect><rect x="${x+bw*.52}" y="${H-h2}" width="${bw*.34}" height="${h2}" class="b2" rx="2"><title>${m} – dépenses ${eur(b[i])}</title></rect><text x="${x+bw/2}" y="${H+17}" text-anchor="middle" class="ax">${m}</text>`});
 return s+'</svg>'}

/* ================= DEVIS / FACTURES : liste ================= */
function docListHTML(){
 const q=norm(F.docQ);let L=[...S.docs];
 if(F.docs==='devis')L=L.filter(d=>d.type==='devis');
 if(F.docs==='facture')L=L.filter(d=>d.type==='facture'||d.type==='nc');
 if(F.docs==='due')L=L.filter(d=>isLiveInvoice(d)&&docTotal(d).total-paid(d)>0.005);
 if(F.docs==='draft')L=L.filter(d=>!issued(d));
 if(q)L=L.filter(d=>norm(cname(d.clientId)+' '+(d.number||'')+' '+(d.eventPlace||'')).includes(q));
 L.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
 if(!L.length)return empty('Aucun document ici.');
 return `<div class="list">${L.map(d=>`<div class="it" data-go="${issued(d)?'doc':'docEdit'}" data-p="${d.id}">
  <div class="thumb">${d.type==='devis'?'📝':d.type==='nc'?'↩️':'🧾'}</div>
  <div class="grow"><div class="t">${esc(cname(d.clientId))}</div><small class="muted">${TYPE_L[d.type]} ${esc(dnum(d))} · ${fd(d.date)}${d.eventDate?' · événement '+fd(d.eventDate):''}</small></div>
  <div style="text-align:right"><div class="amount">${eur(docTotal(d).total)}</div>${badge(docStatus(d))}</div></div>`).join('')}</div>`;
}

  <div class="alert a-blue">Facture émise : elle ne peut plus être modifiée ni supprimée (obligation légale). Les articles utilisés ont été retirés du stock. En cas d'erreur, annulez-la par une note de crédit (le stock est alors remis) puis refaites-en une (bouton « Dupliquer »).</div>`:''}

/* ================= Vignettes produits (devis/factures et packs) ================= */
function curQty(id){if(VIEW==='pack')return num((PK.comp.find(c=>c.itemId===id)||{}).qty);return num((ED.lines.find(l=>l.itemId===id)||{}).qty)}
function tileInfo(it,SM,q){const need=VIEW==='editor'&&ED?(docUsage(ED)[it.id]||0):q;
 if(it.kind==='pack'){const n=packPossible(it,SM);return{info:`<div class="st">Coût ${eur(unitCost(it,SM))}${n!==null?' · réalisable : <b>'+n+'</b>':''}</div>`,warn:n!==null&&q>n?`⚠ Stock insuffisant (${n} possible)`:''}}
 const s=stk(it,SM);
 if(s.type==='materiel'){const m=matInfo(it,SM);return{info:`<div class="st">Réutilisable · ${m.uses}/${m.N} utilisations${m.ok?' · <b style="color:var(--green)">rentabilisé ✓</b>':''}${s.stock?'<br>En stock : '+nf(s.stock):''}</div>`,warn:''}}
 if(s.type==='service')return{info:'<div class="st">Service (pas de stock)</div>',warn:''};
 return{info:`<div class="st">Stock ${nf(s.stock)} · réservé ${nf(s.res)}<br><b>Disponible : ${nf(s.dispo)}</b></div>`,warn:need>s.dispo?`⚠ Il manque ${nf(need-s.dispo)}${need!==q?' (packs compris)':''}`:''};
}
function tileHTML(it,SM){const q=curQty(it.id),inPack=VIEW==='pack',t=tileInfo(it,SM,q);
 const price=inPack?`Prix d'achat ${eur(it.cost)} / ${esc(it.unit||'pièce')}`:(num(it.price)?`<b>${eur(it.price)}</b> / ${esc(it.unit||'pièce')}`:'<span style="color:var(--orange)">Prix de vente à définir</span>');
 return `<div class="tile ${q>0?'on':''}" id="tile-${it.id}" data-name="${esc(norm(it.name))}">${imgBox(it)}<div class="bd"><div class="nm">${esc(it.name)}</div><div class="st">${price}</div>${t.info}<div class="warn" id="tw-${it.id}">${t.warn}</div>
 <div class="stepper"><button type="button" data-act="pqStep" data-id="${it.id}" data-d="-1" aria-label="Moins">−</button><input type="number" inputmode="decimal" min="0" step="any" value="${q||''}" placeholder="0" data-inp="pq" data-id="${it.id}" aria-label="Quantité"><button type="button" data-act="pqStep" data-id="${it.id}" data-d="1" aria-label="Plus">+</button></div></div></div>`}
function pickerHTML(withPacks){const SM=stockMap(ED&&ED.id),act=it=>it.active!==false;let h=`<input placeholder="🔍 Rechercher un article…" data-inp="pickQ" value="${esc(F.pickQ)}" style="margin-bottom:12px">`;
 if(withPacks){const P=packs().filter(act);h+=`<h3>🎈 Forfaits / packs</h3>${P.length?`<div class="tiles" style="margin-bottom:16px">${P.map(p=>tileHTML(p,SM)).join('')}</div>`:'<div class="muted" style="margin-bottom:14px">Aucun pack. Créez-en dans le Catalogue.</div>'}`}
 TOP.forEach(t=>{if(!withPacks&&t.type==='service')return;const L=articles().filter(a=>a.cat===t.id&&act(a));if(!L.length)return;
  const own=subs().filter(x=>x.parent===t.id),groups=[...own.map(x=>[x.name,L.filter(a=>a.sub===x.id)]),['',L.filter(a=>!own.some(x=>x.id===a.sub))]];
  const key='pick-'+t.id,nSel=L.filter(a=>curQty(a.id)>0).length,isOpen=OPEN[key]??nSel>0;
  h+=`<details class="catsec sec-${t.id}" data-sec="${key}" ${isOpen?'open':''}><summary><span class="chev">▸</span><h3 style="margin:0;flex:1">${t.icon} ${esc(t.name)} <small class="muted">(${L.length} article${L.length>1?'s':''}${nSel?` · <span style="color:var(--accent)">${nSel} choisi${nSel>1?'s':''}</span>`:''})</small></h3></summary><div class="secbody">`;
  groups.forEach(([n,G])=>{if(!G.length)return;h+=`<div class="pgroup">${n?`<div class="muted" style="font-weight:600;margin:2px 0 6px">${esc(n)}</div>`:''}<div class="tiles" style="margin-bottom:14px">${G.map(a=>tileHTML(a,SM)).join('')}</div></div>`});h+='</div></details>'});
 if(!articles().length)h+='<div class="muted">Aucun article. Ajoutez vos tickets d\'achat dans « Dépenses » : les articles arrivent automatiquement dans le catalogue.</div>';
 return h}
function setQty(id,q){q=Math.max(0,r2(q));
 if(VIEW==='pack'){const c=PK.comp.find(x=>x.itemId===id);if(!q)PK.comp=PK.comp.filter(x=>x.itemId!==id);else if(c)c.qty=q;else PK.comp.push({itemId:id,qty:q});return}
 const l=ED.lines.find(x=>x.itemId===id);if(!q){ED.lines=ED.lines.filter(x=>x.itemId!==id);return}if(l){l.qty=q;return}
 const it=item(id),SM=stockMap(ED.id),nl={id:uid(),itemId:id,kind:it.kind,name:it.name,desc:it.desc||'',unit:it.unit||'',qty:q,price:num(it.price),cost:unitCost(it,SM)};
 if(it.kind==='pack')nl.comp=clone(it.comp||[]);ED.lines.push(nl)}
function refreshAfterQty(id,full){const SM=stockMap(ED&&ED.id),it=item(id),q=curQty(id);
 const tile=$('#tile-'+id);if(tile){if(full)tile.outerHTML=tileHTML(it,SM);else{tile.classList.toggle('on',q>0);$('#tw-'+id).textContent=tileInfo(it,SM,q).warn}}
 if(VIEW==='pack'){$('#packCalc').innerHTML=packCalcHTML();return}
 // un pack choisi peut changer la dispo d'autres vignettes : on met à jour les alertes visibles
 document.querySelectorAll('.tile[id^="tile-"]').forEach(t=>{const x=item(t.id.slice(5));if(x&&x.id!==id){const w=$('#tw-'+x.id);if(w)w.textContent=tileInfo(x,SM,curQty(x.id)).warn}});
 $('#recap').innerHTML=recapHTML();$('#edTotal').textContent=eur(docTotal(ED).total)}

function catTile(it,SM){const s=stk(it,SM),t=s.type;let info='';
 if(t==='stock')info=`Stock <b>${nf(s.stock)}</b>${s.res?' · réservé '+nf(s.res):''}`;else if(t==='materiel'){const m=matInfo(it,SM);info=`${m.uses}/${m.N} utilisations${m.ok?' ✓':''}`}else info='Service';
 const moveSel=(it.cat==='a_classer'||TOUCH)?`<select data-chg="moveCat" data-id="${it.id}" aria-label="Classer dans">${opt('',it.cat==='a_classer'?'Classer dans…':'Déplacer vers…','')}${classOptions(it)}</select>`:'';
 return `<div class="tile click" draggable="true" data-drag="${it.id}" data-act="editArticle" data-id="${it.id}">${it.active===false?'<span class="tag">masqué</span>':''}${imgBox(it)}<div class="bd"><div class="nm">${esc(it.name)}</div><div class="st">Achat ${eur(it.cost)}${num(it.price)?' · vente <b>'+eur(it.price)+'</b>':''}</div><div class="st">${info}</div>${moveSel}</div></div>`}
function packTile(p,SM){const c=calcPack(p,SM),mg=r2(num(p.price)-c.base);
 return `<div class="tile click" data-act="editPack" data-id="${p.id}">${p.active===false?'<span class="tag">masqué</span>':''}${imgBox(p)}<div class="bd"><div class="nm">${esc(p.name)}</div><div class="st"><b>${eur(p.price)}</b> · coût de revient ${eur(c.base)}</div><div class="st" style="color:${mg<0?'var(--red)':'var(--green)'}">Marge ${eur(mg)}</div><div class="st">${(p.comp||[]).length} article(s)</div></div></div>`}
function vCat(){const SM=stockMap(),A=articles(),todo=A.filter(a=>a.cat==='a_classer');
 const grid=L=>L.length?`<div class="tiles">${L.map(a=>catTile(a,SM)).join('')}</div>`:'<div class="hint">Glissez des articles ici</div>';
 const section=t=>{const L=A.filter(a=>a.cat===t.id),own=subs().filter(x=>x.parent===t.id),loose=L.filter(a=>!own.some(x=>x.id===a.sub));
  const key='cat-'+t.id;return `<details class="catsec sec-${t.id}" data-sec="${key}" ${OPEN[key]?'open':''}><summary class="dropsum" data-cat="${t.id}" data-sub=""><span class="chev">▸</span><h3 style="margin:0;flex:1">${t.icon} ${esc(t.name)} <small class="muted">(${L.length})</small></h3><button class="sm" data-act="newSub" data-p="${t.id}">+ Sous-catégorie</button></summary><div class="secbody"><p class="muted" style="margin:0 0 10px"><small>${t.hint}</small></p>
  ${own.map(x=>{const LL=L.filter(a=>a.sub===x.id);return `<div class="subcat"><div class="row between"><b>${esc(x.name)} <small class="muted">(${LL.length})</small></b><button class="sm link" data-act="editSub" data-id="${x.id}" title="Renommer / supprimer">✎</button></div><div class="dropzone" data-cat="${t.id}" data-sub="${x.id}">${grid(LL)}</div></div>`}).join('')}
  ${loose.length||!own.length?`<div class="subcat"><b class="muted">${own.length?'Sans sous-catégorie':''}</b><div class="dropzone" data-cat="${t.id}" data-sub="">${grid(loose)}</div></div>`:''}</div></details>`};
 return `<div class="row between"><h2>Catalogue</h2><div class="row"><label class="btn" style="margin:0;color:var(--ink)">📥 Importer un catalogue<input type="file" accept=".json,application/json" data-chg="importCatalog" hidden></label><button class="pri" data-act="newArticle">+ Article</button></div></div>
 <div class="card"><div class="row between"><h3 style="margin:0">🎈 Forfaits / packs</h3><button class="pri sm" data-act="newPack">+ Créer un pack</button></div><p class="muted" style="margin:4px 0 12px"><small>Composez un pack avec vos articles : l'appli calcule le coût de revient (réutilisable déjà rentabilisé = 0 €) et vous propose un prix de vente.</small></p>
  ${packs().length?`<div class="tiles">${packs().map(p=>packTile(p,SM)).join('')}</div>`:'<div class="muted">Aucun pack pour le moment.</div>'}</div>
 ${todo.length?`<div class="card catcard todo"><h3>📥 À classer <small class="muted">(${todo.length})</small></h3><p class="muted" style="margin:0 0 10px"><small>Glissez chaque article dans Consommable ou Réutilisable (sur téléphone : menu « Classer dans… » sous la vignette).</small></p><div class="dropzone" data-cat="a_classer" data-sub="">${grid(todo)}</div></div>`:''}

function packCalcHTML(){const s=S.settings,c=calcPack(PK),p=num(PK.price);
 const meth=(t,d,v)=>`<div class="method"><div><b>${t}</b><br><small class="muted">${d}</small></div><div class="row" style="flex-wrap:nowrap"><b>${eur(v)}</b><button type="button" class="sm" data-act="usePackPrice" data-v="${v}">Utiliser</button></div></div>`;
 const al=[];
 if(p>0&&p<c.base)al.push(['red',`Votre prix (${eur(p)}) est sous le coût de revient (${eur(c.base)}) : vous perdez de l'argent.`]);
 else if(p>0&&p<c.m1)al.push(['orange',`Le prix couvre les coûts mais le bénéfice est sous votre objectif (marge : ${eur(p-c.base)}).`]);
 if(p>0&&c.marche>0&&p>c.marche*1.2)al.push(['orange',`Prix ${Math.round((p/c.marche-1)*100)} % au-dessus du marché : rentable mais peut-être difficile à vendre.`]);
 if(p>0&&c.marche>0&&p<c.marche*0.8)al.push(['blue',`Vous êtes ${Math.round((1-p/c.marche)*100)} % sous le marché : vous pourriez augmenter le prix.`]);
 if(p>0&&p>=c.m1&&!(c.marche>0&&p>c.marche*1.2))al.push(['green',`Prix rentable ✓ — marge ${eur(p-c.base)} (${Math.round((p-c.base)/p*100)} % du prix).`]);
 return `<h3>Composition et coût de revient</h3>${c.det.length?`<div class="scroll"><table class="t"><tr><th>Article</th><th class="r">Qté</th><th class="r">Coût unit.</th><th class="r">Total</th></tr>${c.det.map(x=>`<tr><td>${esc(x.it.name)}${x.t==='materiel'?`<br><small class="muted">${x.am?'déjà rentabilisé → non compté':'matériel : prix ÷ '+N_AMORT()}</small>`:''}</td><td class="r">${nf(x.qty)}</td><td class="r">${eur(x.u)}</td><td class="r">${eur(x.v)}</td></tr>`).join('')}</table></div>`:'<div class="muted">Choisissez des articles ci-dessus.</div>'}
 <table class="t" style="margin-top:8px"><tr><td>Articles consommés</td><td class="r">${eur(c.art)}</td></tr><tr><td>Matériel (part non rentabilisée)</td><td class="r">${eur(c.mat)}</td></tr><tr><td>Main-d'œuvre (${nf(PK.calc.heures)} h × ${eur(s.taux)})</td><td class="r">${eur(c.mo)}</td></tr><tr><td>Déplacement (${nf(PK.calc.km)} km)</td><td class="r">${eur(c.dep)}</td></tr><tr><td>Frais généraux</td><td class="r">${eur(c.frais)}</td></tr><tr><td><b>Coût de revient total</b></td><td class="r"><b>${eur(c.base)}</b></td></tr></table>
 <h3 style="margin-top:14px">Prix de vente conseillé</h3>
 ${meth('1. Coût complet + bénéfice',`Coût de revient + ${c.marge} % (méthode conseillée)`,c.m1)}${meth('2. Achats × coefficient',`Articles × ${num(s.coef)} (contrôle rapide)`,c.m2)}${meth('3. Temps de travail','Heures × taux horaire + frais du projet',c.m3)}${c.marche>0?meth('4. Prix du marché','Prestation équivalente dans votre région',c.marche):''}
 <div style="margin-top:8px">${al.map(a=>`<div class="alert a-${a[0]}">${a[1]}</div>`).join('')}</div>`}

// relie chaque ligne à un article du catalogue (crée l'article dans « À classer » si besoin)
async function linkExpenseLines(e){for(const l of e.lines||[]){l.name=String(l.name||'').trim();l.qty=num(l.qty)||1;l.unitPrice=r2(num(l.unitPrice));if(!l.name)continue;
 let it=l.itemId&&item(l.itemId);if(!it){it=articles().find(a=>norm(a.name)===norm(l.name));}
 if(!it){it={id:uid(),kind:'article',cat:'a_classer',sub:'',priceManual:false,name:l.name,desc:'',photo:'',unit:'pièce',cost:l.unitPrice,price:0,stockAdj:0,supplier:e.fournisseur||'',active:true,created:Date.now()}}
 else if(l.unitPrice){it.cost=l.unitPrice;if(e.fournisseur)it.supplier=e.fournisseur}
 autoPrice(it);
 await save('catalog',it);l.itemId=it.id}
 e.lines=(e.lines||[]).filter(l=>l.name)}

const shiftWE=iso=>{const d=new Date(iso+'T12:00:00'),w=d.getDay();if(w===6)d.setDate(d.getDate()+2);else if(w===0)d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)};

function deadlines(){const s=S.settings,out=[],y0=new Date().getFullYear(),st=s.dateDebut||'',ok=d=>!st||d>=st;
 for(const y of[y0-1,y0,y0+1]){

   out.push({key:`ucm-${y}-T${i+1}`,date:d,cat:'social',title:`Cotisation sociale UCM – ${i+1}${i?'e':'er'} trimestre ${y}`,amount:num(s.ucmTrim),
    desc:"À payer au plus tard le dernier jour du trimestre, avec la communication structurée de l'avis UCM. Vérifiez le montant exact sur l'avis (frais de gestion compris)."})});
  if(s.vaOn!=='non'){[['04-10','1'],['07-10','2'],['10-10','3'],['12-20','4']].forEach(([md,n])=>{const d=shiftWE(`${y}-${md}`);if(!ok(d))return;
    out.push({key:`va-${y}-${n}`,date:d,cat:'fisc',optional:true,title:`Versement anticipé n°${n} – revenus ${y}`,amount:vaAmount(y),
     desc:"Facultatif mais conseillé : évite une majoration d'impôt sur vos revenus d'indépendant. Montant proposé = impôt estimé de l'année ÷ 4. Paiement au SPF Finances avec la communication de votre compte provisionnel (MyMinfin)."})});
   const d5=shiftWE(`${y+1}-02-20`);if(y>=2026&&ok(d5))out.push({key:`va-${y}-5`,date:d5,cat:'fisc',optional:true,title:`Versement anticipé n°5 – revenus ${y}`,amount:0,
     desc:"Dernière possibilité de versement anticipé pour les revenus de l'année écoulée (nouveau depuis 2026). Facultatif."})}
  if(!st||st<`${y}-01-01`)out.push({key:`ipp-${y}`,date:`${y}-06-30`,cat:'fisc',title:`Déclaration d'impôts ${y} (revenus ${y-1})`,
    desc:"Date limite exacte à vérifier sur MyMinfin (Tax-on-web : en général fin juin – mi-juillet ; plus tard si un comptable la fait). Déclarez vos bénéfices d'indépendant avec votre salaire. Exportez vos recettes et dépenses (Réglages) pour la préparer."});
  [['04-10',1,y],['07-10',2,y],['10-10',3,y],['01-10',4,y+1]].forEach(([md,q,yy])=>{const d=`${yy}-${md}`,qEnd=`${y}-${['03-31','06-30','09-30','12-31'][q-1]}`;if(!ok(qEnd))return;
   out.push({key:`clas-${y}-T${q}`,date:d,cat:'admin',title:`Classer les pièces du ${q}${q>1?'e':'er'} trimestre ${y}`,
    desc:"Vérifiez que chaque dépense a sa photo, que chaque facture payée est marquée « payée », envoyez les pièces à votre comptable s'il y en a un, et faites une sauvegarde de l'appli."})});
  if(ok(`${y}-12-31`)){out.push({key:`inv-${y}`,date:`${y}-12-31`,cat:'admin',title:`Inventaire du stock au 31/12/${y}`,desc:"Comptez votre stock, corrigez-le dans le Catalogue, puis exportez l'inventaire (Réglages) pour votre comptable."});
   out.push({key:`tva-${y}`,date:`${y}-12-15`,cat:'tva',title:`Contrôle franchise TVA ${y}`,desc:`Vérifiez la jauge du tableau de bord (plafond ${eur(s.plafond)}) et demandez à l'UCM / au comptable si une déclaration ou un listing TVA annuel est à déposer.`})}
 }
 if(s.rcDate)[y0-1,y0,y0+1].forEach(y=>{const d=`${y}${s.rcDate.slice(4)}`;if(d>=s.rcDate)out.push({key:`rc-${y}`,date:d,cat:'admin',title:'Échéance de l\'assurance RC professionnelle',desc:'Vérifiez la prime et que votre activité (décoration, location de matériel) est bien couverte.'})});
 reminders().forEach(r=>{if(!r.date)return;const base={cat:'perso',title:r.title||'Rappel',amount:num(r.amount),desc:r.note||'',rid:r.id};
  if(r.repeat==='mois'){let d=new Date(r.date+'T12:00:00');const lim=addDays(todayISO(),400);for(let i=0;i<60;i++){const iso=d.toISOString().slice(0,10);if(iso>lim)break;if(iso>=addDays(todayISO(),-90))out.push({...base,key:`p-${r.id}-${iso}`,date:iso});d.setMonth(d.getMonth()+1)}}
  else if(r.repeat==='an'){[y0-1,y0,y0+1].forEach(y=>{const iso=`${y}${r.date.slice(4)}`;if(iso>=r.date)out.push({...base,key:`p-${r.id}-${iso}`,date:iso})})}
  else out.push({...base,key:`p-${r.id}`,date:r.date})});
 return out.sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title))}

function vAgenda(){const s=S.settings,all=deadlines(),t=todayISO(),showDone=!!F.dlAll;

const icsEsc=t=>String(t??'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(l){const out=[];while(l.length>73){out.push(l.slice(0,73));l=' '+l.slice(73)}out.push(l);return out.join('\r\n')}
function buildIcs(){const t=todayISO(),L=deadlines().filter(x=>x.date>=t&&!dlDone()[x.key]),now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 const out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ma Deco Pro//Echeances//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Ma Déco Pro – échéances'];
 L.forEach(x=>{const al=(trig,txt)=>['BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(txt)}`,`TRIGGER:${trig}`,'END:VALARM'];
  out.push('BEGIN:VEVENT',`UID:${x.key}@madecopro`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${x.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(x.date,1).replace(/-/g,'')}`,
   `SUMMARY:${icsEsc((x.optional?'(facultatif) ':'')+x.title+(x.amount?' – '+eur(x.amount):''))}`,`DESCRIPTION:${icsEsc(x.desc)}`,

 el:t=>{const l=TMP.lines.find(x=>x.id===t.dataset.id);if(!l)return;const f=t.dataset.f,row=t.closest('.eline');
  if(f==='total'){l.unitPrice=num(l.qty)?r2(num(t.value)/num(l.qty)):num(t.value);row.querySelector('[data-f=unitPrice]').value=l.unitPrice}
  else{l[f]=t.value;if(f==='qty'||f==='unitPrice')row.querySelector('[data-f=total]').value=r2(num(l.qty)*num(l.unitPrice))}
  if(f==='itemId'&&t.value&&!l.name){const it=item(t.value);l.name=it.name;row.querySelector('[data-f=name]').value=it.name}
  const tt=$('#elTot');if(tt)tt.textContent=eur(sum(TMP.lines,x=>num(x.qty)*num(x.unitPrice)))}
};
const CHG={
 moveCat:async t=>{const it=item(t.dataset.id);if(!t.value)return;const[c,sb]=t.value.split('|');await classify(it,c,sb);rerenderKeepScroll()},
 artType:t=>{$('#toChoose')?.remove();document.querySelectorAll('#mf .typeopt').forEach(l=>l.classList.toggle('on',l.contains(t)));const cur=$('#mf [name=sub]').value;$('#subWrap').innerHTML=subSelect(t.value,subs().some(x=>x.id===cur&&x.parent===t.value)?cur:'');
  const f=$('#mf');if(!$('#mf [name=sub]').value){const tmp={name:f.name.value,cat:t.value,sub:''};autoSub(tmp);if(tmp.sub)$('#mf [name=sub]').value=tmp.sub}
  if(TMP.priceManual){const sp=suggestedPrice(catById(t.value).type,f.cost.value);if(Math.abs(num(f.price.value)-sp)<0.005)TMP.priceManual=false}updSugg()},
 expType:t=>{$('#expLinesWrap').style.display=t.value==='achats'?'':'none'},
 expFile:async t=>{const f=t.files[0];if(!f)return;
  if(f.type==='application/pdf'){if(f.size>8e6)return toast('PDF trop lourd (max 8 Mo).');TMP.file={type:f.type,name:f.name,data:await readFile(f)}}
  else TMP.file={type:'image/jpeg',name:f.name,data:await compressImage(f,1400,0.7)};$('#expPrev').innerHTML=filePrev(TMP.file);toast('Justificatif ajouté')},
 itemPhoto:async t=>{const f=t.files[0];if(!f)return;TMP.photo=await compressImage(f,700,0.78);$('#itemPh').innerHTML=`<img src="${TMP.photo}" style="max-width:140px;border-radius:9px">`},
 packPhoto:async t=>{const f=t.files[0];if(!f)return;PK.photo=await compressImage(f,1400,0.78);$('#pkPh').innerHTML=`<img src="${PK.photo}" class="pk-photo" style="max-height:200px">`},
 pkActive:t=>{PK.active=t.checked},
 dlDone:async t=>{const k=t.dataset.key;if(t.checked)dlDone()[k]=todayISO();else delete dlDone()[k];await saveSettings();rerenderKeepScroll()},
 check:async t=>{checks()[t.dataset.id]=t.checked;await saveSettings();rerenderKeepScroll()},
 fgOn:t=>{const l=fgList().find(x=>x.id===t.dataset.id);l.on=t.checked;t.closest('tr').style.opacity=t.checked?'':'.5';refreshFg();saveSettings()},
 clientPhoto:async t=>{const c=clientById(t.dataset.id);c.photos=c.photos||[];for(const f of t.files)c.photos.push({id:uid(),date:todayISO(),data:await compressImage(f,1600,0.75)});await save('clients',c);toast('Photo(s) ajoutée(s)');render()},
 logo:async t=>{const f=t.files[0];if(!f)return;S.settings.logo=await compressImage(f,500,0.9,'image/png');await saveSettings();toast('Logo enregistré');render()},
 importCatalog:async t=>{const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='decoGestion-catalogue'||!Array.isArray(d.articles))throw new Error('Ce fichier n\'est pas un catalogue pour cette application.');
  const rep=d.mode==='replace';if(!confirm(`Importer ${d.articles.length} article(s) ?`+(rep?`\n\nATTENTION : les ${S.catalog.length} article(s) et packs actuels du catalogue seront SUPPRIMÉS (vos factures, dépenses et clients ne changent pas).`:'')))return;
  if(rep){for(const c of [...S.catalog])await removeRec('catalog',c.id)}
  for(const a of d.articles){const cat=catById(a.cat)?a.cat:'a_classer',it={...newArticleObj(cat),name:String(a.name||'Article'),unit:a.unit||'pièce',cost:r2(num(a.cost)),price:r2(num(a.price)),priceManual:num(a.price)>0,desc:a.desc||'',stockAdj:num(a.qty),created:Date.now()};autoSub(it);autoPrice(it);await save('catalog',it)}
  toast(`${d.articles.length} article(s) importé(s)`);go('cat')}catch(e){alert('Import impossible : '+e.message)}finally{t.value=''}},
 importTickets:async t=>{const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='decoGestion-tickets'||!Array.isArray(d.tickets))throw new Error('Ce fichier n\'est pas un fichier de tickets pour cette application.');
  if(!confirm(`Importer ${d.tickets.length} ticket(s) ?`))return;const before=articles().length;let n=0;
  for(const k of d.tickets){if(k.id&&S.expenses.some(e=>e.id===k.id))continue;
   const e={id:k.id||uid(),date:k.date||todayISO(),fournisseur:k.fournisseur||'',paiement:k.paiement||'',categorie:EXP_CATS[k.categorie]?k.categorie:'achats',montant:r2(num(k.montant)),note:k.note||'',created:Date.now(),
    lines:(k.lignes||k.lines||[]).map(l=>({id:uid(),name:l.nom||l.name||'',qty:num(l.quantite??l.qty)||1,unitPrice:r2(num(l.prixUnitaire??l.unitPrice)||(num(l.total)/(num(l.quantite??l.qty)||1))),itemId:''})),
    file:k.photo?{type:'image/jpeg',name:'ticket.jpg',data:k.photo}:null};
   if(!e.montant)e.montant=sum(e.lines,l=>l.qty*l.unitPrice);await addExpense(e);n++}
  toast(`${n} ticket(s) importé(s) · ${articles().length-before} nouvel(s) article(s) « À classer »`);go('exp')}catch(e){alert('Import impossible : '+e.message)}finally{t.value=''}},
 importBackup:async t=>{const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='decoGestion')throw new Error('Ce fichier n\'est pas une sauvegarde de cette application.');
  if(Sync.on){
   const n=['clients','catalog','expenses','docs'].reduce((a,s)=>a+(d[s]||[]).length,0);
   if(!confirm(`Importer la sauvegarde du ${fd((d.exportedAt||'').slice(0,10))} (${n} éléments) ?\nSes données seront envoyées en ligne et apparaîtront sur tous vos appareils. Les éléments déjà présents sont remplacés par la version de la sauvegarde, sauf les factures émises, qui restent protégées.`))return;
   closeModal();toast('Import en cours…');Sync.importing=true;
   try{S.settings={...DEFAULT_SETTINGS,...d.settings,id:'main'};await DB.put('settings',S.settings);
    for(const s of ['clients','catalog','expenses','docs'])for(const r of d[s]||[])await save(s,r)}
   finally{Sync.importing=false}
   await migrate();toast('Sauvegarde importée : envoi en ligne en cours (voir l\'indicateur en haut)');go('dash');Sync.run();return}
  if(!confirm(`Restaurer la sauvegarde du ${fd((d.exportedAt||'').slice(0,10))} ?\nToutes les données actuelles de cet appareil seront REMPLACÉES.`))return;
  for(const s of STORES)await DB.clear(s);S.settings={...DEFAULT_SETTINGS,...d.settings,id:'main'};await DB.put('settings',S.settings);
  for(const s of ['clients','catalog','expenses','docs']){S[s]=d[s]||[];for(const r of S[s])await DB.put(s,r)}await migrate();toast('Sauvegarde restaurée');go('dash')}catch(e){alert('Restauration impossible : '+e.message)}finally{t.value=''}}
};

/* ================= Écouteurs ================= */
document.addEventListener('click',async e=>{
 const a=e.target.closest('[data-act]');
 if(a&&ACT[a.dataset.act]){if(a.tagName!=='A')e.preventDefault();e.stopPropagation();try{await ACT[a.dataset.act](a.dataset,a,e)}catch(err){console.error(err);toast('Erreur : '+err.message)}return}
 if(e.target.closest('select,input,textarea,label'))return;
 const g=e.target.closest('[data-go]');
 if(g){e.preventDefault();if(g.dataset.go==='docEdit'){const x=S.docs.find(z=>z.id===g.dataset.p);if(x){closeModal();ED=clone(x);VIEW='editor';PARAM=null;F.pickQ='';render();window.scrollTo(0,0)}return}closeModal();go(g.dataset.go,g.dataset.p)}
});
// les sélecteurs dans une vignette cliquable ne doivent pas ouvrir la fiche
document.addEventListener('click',e=>{if(e.target.closest('.tile select'))e.stopPropagation()},true);
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec)OPEN[d.dataset.sec]=d.open},true);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.inp&&INP[t.dataset.inp])INP[t.dataset.inp](t)});
document.addEventListener('change',async e=>{const t=e.target;try{if(t.dataset.chg&&CHG[t.dataset.chg])await CHG[t.dataset.chg](t);else if(t.tagName==='SELECT'&&t.dataset.inp&&INP[t.dataset.inp])INP[t.dataset.inp](t)}catch(err){console.error(err);toast('Erreur : '+err.message)}});
// glisser-déposer des articles entre catégories
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(t){e.dataTransfer.setData('text/plain',t.dataset.drag);e.dataTransfer.effectAllowed='move';t.style.opacity=.5}});
document.addEventListener('dragend',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(t)t.style.opacity=''});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.dropzone,.dropsum');if(z){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.dropzone.over,.dropsum.over').forEach(o=>o!==z&&o.classList.remove('over'));z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.dropzone,.dropsum');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
document.addEventListener('drop',async e=>{const z=e.target.closest&&e.target.closest('.dropzone,.dropsum');if(!z)return;e.preventDefault();z.classList.remove('over');
 const it=item(e.dataTransfer.getData('text/plain'));if(it&&(it.cat!==z.dataset.cat||(it.sub||'')!==(z.dataset.sub||''))){await classify(it,z.dataset.cat,z.dataset.sub||'');rerenderKeepScroll()}});
// photo pas encore téléchargée depuis le serveur : on affiche une image d'attente
document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&(t.getAttribute('src')||'').startsWith(REF))t.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 30"><rect width="40" height="30" fill="#f2ecef"/><text x="20" y="19" font-size="11" text-anchor="middle">⏳</text></svg>')},true);
window.addEventListener('beforeunload',e=>{if((VIEW==='editor'&&ED)||(VIEW==='pack'&&PK)){e.preventDefault();e.returnValue=''}});

/* ================= Migration depuis la version 1 ================= */
async function migrate(){
 for(const c of S.catalog){let ch=false;
  if(c.kind==='forfait'){c.kind='pack';c.comp=c.comp||[];c.calc={heures:c.calc?.heures??'',km:c.calc?.km??'',frais:c.calc?.frais??S.settings.fraisFixe,marge:c.calc?.marge??S.settings.marge,marche:c.calc?.marche??''};ch=true}
  else if(c.kind==='supplement'){c.kind='article';c.cat='service';c.cost=num(c.cost);c.stockAdj=0;ch=true}
  if(ch)await save('catalog',c)}
 for(const e of S.expenses){if(e.categorie==='conso'||e.categorie==='materiel'){const wasMat=e.categorie==='materiel';e.categorie='achats';e.lines=e.lines||[];
  if(wasMat&&!e.lines.length){const it={...newArticleObj('materiel'),name:e.materialName||e.note||e.fournisseur||'Matériel',cost:r2(num(e.montant)),supplier:e.fournisseur||'',created:Date.now()};await save('catalog',it);e.lines=[{id:uid(),name:it.name,qty:1,unitPrice:it.cost,itemId:it.id}]}
  await save('expenses',e)}}
 // v3 : 2 catégories de stock + sous-catégories
 const s=S.settings;let ch=false;
 if(!Array.isArray(s.subs)){s.subs=DEFAULT_SUBS.map(([p,n])=>({id:'s'+uid(),parent:p,name:n}));
  (s.cats||[]).forEach(c=>{if(!TOP.some(t=>t.id===c.id)&&articles().some(a=>a.cat===c.id))s.subs.push({id:c.id,parent:c.type==='materiel'?'materiel':c.type==='service'?'service':'consommable',name:c.name.replace(/\s*\(.*\)$/,'')})});ch=true}
 for(const a of articles()){let mod=false;
  if(!TOP.some(t=>t.id===a.cat)){const sb=s.subs.find(x=>x.id===a.cat);a.sub=sb?sb.id:'';a.cat=sb?sb.parent:'a_classer';mod=true}
  if(!a.v3){autoSub(a);if(a.priceManual===undefined){const sp=suggestedPrice(catOf(a).type,a.cost);a.priceManual=num(a.price)>0&&Math.abs(num(a.price)-sp)>0.005}autoPrice(a);a.v3=true;mod=true}
  if(mod)await save('catalog',a)}
 if(!Array.isArray(s.fg)){s.fg=DEFAULT_FG.map(n=>({id:uid(),name:n,amount:0,period:'mois',on:true}));ch=true}
 if(ch)await saveSettings();
}

/* ================= Connexion, installation ================= */
const waitSync=(ms=8000)=>Promise.race([Sync.run(),new Promise(r=>setTimeout(r,ms))]);
const INSTALL={ev:null};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL.ev=e});
function loginForm(){return `<form id="lf" onsubmit="ACT.login();return false">
 <label class="f">E-mail<input name="email" type="email" autocomplete="username" inputmode="email" required value="${esc(Auth.email())}"></label>
 <label class="f">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
 <button class="pri" type="submit" style="width:100%;justify-content:center">Se connecter</button></form><p id="loginMsg" class="muted" style="min-height:1.4em"></p>`}
function vLogin(){return `<div class="card" style="max-width:420px;margin:30px auto"><h2>🔐 Connexion</h2>
 <p class="muted">À faire <b>une seule fois</b> sur cet appareil. Vos données se synchroniseront ensuite automatiquement, même après avoir fermé l'appli.</p>${loginForm()}</div>`}
function openWelcome(){openModal(`<h2>👋 Bienvenue !</h2><p>Votre espace en ligne est vide. Pour retrouver toutes vos données (catalogue, clients, factures, dépenses, photos…), importez la <b>sauvegarde JSON</b> faite depuis votre ancienne appli (Réglages › Sauvegarder mes données).</p>
 <div class="row"><label class="btn pri" style="margin:0">⬆️ Importer ma sauvegarde<input type="file" accept=".json,application/json" data-chg="importBackup" hidden></label><button data-act="closeModal">Commencer sans sauvegarde</button></div>
 <p class="muted"><small>Vous pourrez aussi le faire plus tard dans Réglages › Restaurer une sauvegarde.</small></p>`)}

/* ================= Démarrage ================= */
async function loadLocal(){const st=await DB.all('settings');
 for(const s of ['clients','catalog','expenses','docs'])S[s]=await DB.all(s);
 S.settings={...DEFAULT_SETTINGS,...(st.find(x=>x.id==='main')||{})};return st.length}
async function boot(){
 if(Sync.on&&!Sync.ready){
  document.body.classList.add('locked');Sync.badge();
  if(!Auth.s){$('#app').innerHTML=vLogin();return}
  $('#app').innerHTML='<div class="empty">⏳ Téléchargement de vos données…<br><small>(la première fois, cela peut prendre une minute si vous avez beaucoup de photos)</small></div>';
  await Sync.run();
  if(Sync.state==='auth'){Auth.set(null);Sync.badge()}
  if(Sync.state!=='ok'){$('#app').innerHTML=Auth.s?`<div class="card" style="max-width:460px;margin:30px auto"><h2>Connexion au serveur impossible</h2><p>${esc(Sync.err)}</p><p class="muted">Vérifiez que l'appareil est connecté à Internet.</p><button class="pri" data-act="retryBoot">Réessayer</button></div>`:vLogin();
   if(!Auth.s)$('#loginMsg').textContent=Sync.err;return}
  Sync.ready=true;await Sync.setMeta('ready',1);document.body.classList.remove('locked');
  const isEmpty=!S.docs.length&&!S.expenses.length&&!S.catalog.length&&!S.clients.length;
  await migrate();render();Sync.start();if(isEmpty)openWelcome();return}
 await migrate();render();if(Sync.on)Sync.start();
}
(async function init(){
 await DB.open();
 if(DB.failed)Sync.on=false;
 const n=await loadLocal();
 if(Sync.on)Sync.ready=!!(await Sync.meta('ready'));
 if(!n&&!(Sync.on&&!Sync.ready))await saveSettings();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!CFG.noServiceWorker)navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
 await boot();
})();
</script>
</body>
